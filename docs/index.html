  const inc = TR.list.filter(t=>t.to===CL.id && t.state==="pending"), out = TR.list.filter(t=>t.from===CL.id && t.state==="pending"), hist = TR.list.filter(t=>t.state!=="pending").slice(0,20);
  const sec = (title, arr, empty) => `<section class="panel" style="margin-top:14px"><div class="ph"><h2>${title}</h2></div>${arr.length ? arr.map(trCard).join("") : `<p class="hint">${empty}</p>`}</section>`;
  box.innerHTML = sec("Входящие предложения", inc, "Пока никто ничего не предлагает.") + sec("Ваши предложения", out, "Вы ещё ничего не предлагали.") + sec("История", hist, "Здесь будут завершённые обмены.");
  const all = inc.concat(out, hist);
  box.querySelectorAll(".tr-card").forEach((a,i)=>{ const t = all[i]; a.querySelector(".tr-who b").textContent = t.from===CL.id ? t.toNick : t.fromNick; });
}
/* --- окно обмена --- */
function twShell(title, partner){
  return `<div class="view-head"><div><h1>${title}</h1></div><a class="btn" href="#trades">← Все трейды</a></div>
    <div class="tw" id="tw">
      <div class="tw-head">${partner ? framed(partner, avatarOf(partner,40)) : ""}<div><small>Обмен с игроком</small><b id="tw-nick" class="${partner ? nickCls(partner) : ""}"></b></div></div>
      <div class="tw-offers">
        <section class="tw-side"><h3>Вы отдаёте</h3><div class="tw-box" id="tw-give"></div><div class="tw-coins" id="tw-gc"></div><div class="tw-total" id="tw-gt"></div></section>
        <div class="tw-swap" aria-hidden="true">⇄</div>
        <section class="tw-side"><h3>Вы получаете</h3><div class="tw-box" id="tw-get"></div><div class="tw-coins" id="tw-rc"></div><div class="tw-total" id="tw-rt"></div></section>
      </div>
      <div id="tw-pick"></div>
      <div class="tw-foot" id="tw-foot"></div>
    </div>`;
}
const twItems = (arr, rm) => arr.length ? arr.map(it=>mini(it, rm ? `data-rm="${it.id}" title="Убрать"` : `tabindex="-1"`, false)).join("") : `<p class="tw-empty">пусто</p>`;
function viewTradeNew(pid){
  const app = document.getElementById("app");
  if(!trOn()){ location.replace("#trades"); return; }
  const p = CL.list.find(x=>x.id===pid);
  if(!p){ app.innerHTML = `<div class="view-head"><h1>Обмен</h1></div><div class="empty">Игрок не найден. <a href="#trades">К списку трейдов</a></div>`; return; }
  if(!TR.draft || TR.draft.to!==pid) TR.draft = {to:pid, give:new Set(), get:new Set(), giveCoins:0, getCoins:0};
  TR.view = null;
  app.innerHTML = twShell("Новый обмен", p);
  document.getElementById("tw-nick").textContent = p.nick;
  drawTradeNew(p);
}
function drawTradeNew(p){
  const d = TR.draft;
  const give = S.inv.filter(i=>d.give.has(i.id)), get = (p.tinv||[]).filter(i=>d.get.has(i.id));
  [...d.give].forEach(id=>{ if(!S.inv.some(i=>i.id===id)) d.give.delete(id); });
  document.getElementById("tw-give").innerHTML = twItems(give, true);
  document.getElementById("tw-get").innerHTML = twItems(get, true);
  document.getElementById("tw-gc").innerHTML = `<label>+ монеты <input id="tw-gci" type="number" min="0" step="1" inputmode="numeric" value="${d.giveCoins||""}" placeholder="0"></label>`;
  document.getElementById("tw-rc").innerHTML = `<label>+ монеты <input id="tw-rci" type="number" min="0" step="1" inputmode="numeric" value="${d.getCoins||""}" placeholder="0"></label>`;
  const gt = trSum(give) + (d.giveCoins||0), rt = trSum(get) + (d.getCoins||0);
  document.getElementById("tw-gt").innerHTML = `Итого: <b class="num">${money(gt)}</b>`;
  document.getElementById("tw-rt").innerHTML = `Итого: <b class="num">${money(rt)}</b>`;
  const mineInv = S.inv.slice().sort((a,b)=>b.price-a.price), theirs = (p.tinv||[]).slice().sort((a,b)=>b.price-a.price);
  const list = TR.tab==="me" ? mineInv : theirs, sel = TR.tab==="me" ? d.give : d.get;
  document.getElementById("tw-pick").innerHTML = `
    <div class="tabs tw-tabs" role="tablist"><button role="tab" data-tab="me" class="${TR.tab==="me"?'on':''}">Ваш инвентарь</button><button role="tab" data-tab="them" class="${TR.tab==="them"?'on':''}">Инвентарь игрока</button></div>
    <div class="minis tw-inv">${list.length ? list.map(it=>mini(it, `data-pick="${it.id}"`, sel.has(it.id))).join("") : `<p class="empty-note">${TR.tab==="me" ? "Ваш инвентарь пуст." : "У игрока нет предметов для обмена."}</p>`}</div>
    ${TR.tab==="them" ? `<p class="hint">Показаны до 60 самых дорогих предметов игрока на момент его последнего захода.</p>` : ""}`;
  document.getElementById("tw-foot").innerHTML = `<input id="tw-msg" maxlength="120" placeholder="Сообщение (необязательно)" value="${esc(d.msg||"")}"><button class="btn primary" id="tw-send">Отправить предложение</button><span class="hint" id="tw-err"></span>`;
  const rd = ()=>drawTradeNew(p);
  document.querySelectorAll("#tw-pick [data-tab]").forEach(b=>b.addEventListener("click",()=>{ TR.tab = b.dataset.tab; rd(); }));
  document.querySelectorAll("#tw-pick [data-pick]").forEach(b=>b.addEventListener("click",()=>{ const id = b.dataset.pick, set = TR.tab==="me" ? d.give : d.get;
    if(set.has(id)) set.delete(id); else if(set.size < 20) set.add(id); rd(); }));
  document.querySelectorAll("#tw-give [data-rm]").forEach(b=>b.addEventListener("click",()=>{ d.give.delete(b.dataset.rm); rd(); }));
  document.querySelectorAll("#tw-get [data-rm]").forEach(b=>b.addEventListener("click",()=>{ d.get.delete(b.dataset.rm); rd(); }));
  const totals = ()=>{ const g2 = S.inv.filter(i=>d.give.has(i.id)), r2 = (p.tinv||[]).filter(i=>d.get.has(i.id));
    document.getElementById("tw-gt").innerHTML = `Итого: <b class="num">${money(trSum(g2) + (d.giveCoins||0))}</b>`;
    document.getElementById("tw-rt").innerHTML = `Итого: <b class="num">${money(trSum(r2) + (d.getCoins||0))}</b>`; };
  document.getElementById("tw-gci").addEventListener("input", e=>{ d.giveCoins = Math.max(0, Math.floor(Number(e.target.value)||0)); totals(); });
  document.getElementById("tw-rci").addEventListener("input", e=>{ d.getCoins = Math.max(0, Math.floor(Number(e.target.value)||0)); totals(); });
  document.getElementById("tw-msg").addEventListener("input", e=>{ d.msg = e.target.value; });
  document.getElementById("tw-send").addEventListener("click", ()=>trSend(p));
}
async function trSend(p){
  const d = TR.draft, err = document.getElementById("tw-err"), btn = document.getElementById("tw-send");
  const give = S.inv.filter(i=>d.give.has(i.id)), get = (p.tinv||[]).filter(i=>d.get.has(i.id));
  if(!give.length && !get.length && !d.giveCoins && !d.getCoins){ flash(err, false, "Добавьте предметы или монеты"); return; }
  if((d.giveCoins||0) > S.bal){ flash(err, false, "Не хватает монет"); return; }
  btn.disabled = true;
  // замораживаем отдаваемое
  const ids = new Set(give.map(i=>i.id));
  S.inv = S.inv.filter(i=>!ids.has(i.id)); S.bal = Math.round((S.bal - (d.giveCoins||0))*100)/100; save(); renderHeader();
  let r; try{ r = await trAct({action:"create", to:p.id, toNick:p.nick, nick:S.profile.nick, give, get, giveCoins:d.giveCoins||0, getCoins:d.getCoins||0, msg:d.msg||""}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error || !r.trade){ S.inv = give.concat(S.inv); S.bal = Math.round((S.bal + (d.giveCoins||0))*100)/100; save(); renderHeader(); btn.disabled = false; flash(err, false, r.error || "Не получилось"); return; }
  trMine()[r.trade.id] = {done:false}; save();
  TR.list.unshift(r.trade); TR.draft = null;
  if(S.sound) beep(880,.08,.05,"triangle");
  location.hash = "#trade-" + r.trade.id;
}
function viewTrade(id){
  const app = document.getElementById("app");
  if(!trOn()){ location.replace("#trades"); return; }
  TR.view = id;
  const t = TR.list.find(x=>x.id===id);
  if(!t){ app.innerHTML = `<div class="view-head"><h1>Обмен</h1></div><div class="empty">Загрузка…</div>`; trRefresh().then(()=>{ if(TR.view===id && !TR.list.some(x=>x.id===id)) app.innerHTML = `<div class="view-head"><h1>Обмен</h1></div><div class="empty">Обмен не найден. <a href="#trades">К списку трейдов</a></div>`; else if(TR.view===id) viewTrade(id); }); return; }
  const out = t.from===CL.id, pid = out ? t.to : t.from, partner = CL.list.find(x=>x.id===pid) || {id:pid, nick: out ? t.toNick : t.fromNick, av:{g:0,c:0}};
  app.innerHTML = twShell(out ? "Ваше предложение" : "Предложение обмена", partner);
  document.getElementById("tw-nick").textContent = partner.nick;
  drawTradeView(t); trFast();
}
function drawTradeView(t){
  const out = t.from===CL.id;
  const give = out ? t.give : t.get, get = out ? t.get : t.give, gc = (out ? t.giveCoins : t.getCoins)||0, rc = (out ? t.getCoins : t.giveCoins)||0;
  document.getElementById("tw-give").innerHTML = twItems(give, false);
  document.getElementById("tw-get").innerHTML = twItems(get, false);
  document.getElementById("tw-gc").innerHTML = gc ? `+ <b class="num">${money(gc)}</b>` : "";
  document.getElementById("tw-rc").innerHTML = rc ? `+ <b class="num">${money(rc)}</b>` : "";
  document.getElementById("tw-gt").innerHTML = `Итого: <b class="num">${money(trSum(give)+gc)}</b>`;
  document.getElementById("tw-rt").innerHTML = `Итого: <b class="num">${money(trSum(get)+rc)}</b>`;
  document.getElementById("tw-pick").innerHTML = t.msg ? `<p class="tw-note"></p>` : "";
  if(t.msg) document.querySelector(".tw-note").textContent = "Сообщение: " + t.msg;
  const foot = document.getElementById("tw-foot");
  if(t.state==="pending" && !out){
    foot.innerHTML = `<button class="btn primary" id="tw-acc">Принять обмен</button><button class="btn" id="tw-dec">Отклонить</button><span class="hint" id="tw-err"></span>`;
    document.getElementById("tw-acc").addEventListener("click", ()=>trAccept(t));
    document.getElementById("tw-dec").addEventListener("click", ()=>trClose(t, "decline"));
  } else if(t.state==="pending" && out){
    foot.innerHTML = `<span class="tw-status">Ждём ответа игрока. Ваши предметы зарезервированы под этот обмен.</span><button class="btn" id="tw-can">Отменить предложение</button><span class="hint" id="tw-err"></span>`;
    document.getElementById("tw-can").addEventListener("click", ()=>trClose(t, "cancel"));
  } else {
    foot.innerHTML = `<span class="tw-status st-${t.state}">${t.state==="accepted" ? "Обмен состоялся — предметы уже в инвентаре." : t.state==="declined" ? (out ? "Игрок отклонил обмен. Ваши предметы вернулись." : "Вы отклонили обмен.") : (out ? "Вы отменили предложение. Предметы вернулись." : "Игрок отменил предложение.")}</span>`;
  }
}
async function trAccept(t){
  const err = document.getElementById("tw-err"), btn = document.getElementById("tw-acc");
  const ids = new Set((t.get||[]).map(g=>g.id));
  if(![...ids].every(id=>S.inv.some(i=>i.id===id))){ flash(err, false, "У вас уже нет части запрошенных предметов — обмен принять нельзя"); return; }
  if((t.getCoins||0) > S.bal){ flash(err, false, "Не хватает монет для обмена"); return; }
  btn.disabled = true;
  let r; try{ r = await trAct({action:"accept", id:t.id}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error){ btn.disabled = false; flash(err, false, r.error); trRefresh(); return; }
  S.inv = S.inv.filter(i=>!ids.has(i.id)); S.bal = Math.round((S.bal - (t.getCoins||0) + (t.giveCoins||0))*100)/100;
  trAdd(t.give||[]); trMine()[t.id] = {done:true};
  save(); renderHeader();
  if(S.sound){ beep(660,.08,.05,"triangle"); setTimeout(()=>beep(990,.12,.05,"triangle"), 90); }
  const i = TR.list.findIndex(x=>x.id===t.id); if(i>=0) TR.list[i] = r.trade;
  trBadge(); drawTradeView(r.trade);
}
async function trClose(t, action){
  const err = document.getElementById("tw-err");
  let r; try{ r = await trAct({action, id:t.id}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error){ flash(err, false, r.error); trRefresh(); return; }
  const i = TR.list.findIndex(x=>x.id===t.id); if(i>=0) TR.list[i] = r.trade;
  trSettle(); trBadge(); drawTradeView(r.trade);
}

/* ---------- Маршрутизация ---------- */
function route(){
  const h = location.hash.slice(1);
  if(!h.startsWith("case-")) document.body.classList.remove("wide-case");
  document.getElementById("nav-cases").classList.toggle("on", h==="" || h==="cases" || h.startsWith("case-"));
  document.getElementById("nav-inv").classList.toggle("on", h==="inventory" || h==="profile");
  document.getElementById("nav-upg").classList.toggle("on", h==="upgrade");
  document.getElementById("nav-run").classList.toggle("on", h==="runner");
  document.getElementById("nav-crash").classList.toggle("on", h==="crash");
  document.getElementById("nav-ct").classList.toggle("on", h==="contract");
  document.getElementById("nav-mines").classList.toggle("on", h==="mines");
  document.getElementById("nav-qs").classList.toggle("on", h==="quests");
  document.getElementById("nav-tr").classList.toggle("on", h==="trades" || h.startsWith("trade-"));
  document.getElementById("nav-bt").classList.toggle("on", h==="battles" || h.startsWith("battle-"));
  document.getElementById("nav-top").classList.toggle("on", h==="top");
  document.getElementById("nav-admin").classList.toggle("on", h==="admin");
  moreToggle(false); navMoreState();
  if(h==="admin") return viewAdmin();
  if(h==="profile") return viewProfile();
  if(h==="top" && LOCAL_ONLY){ location.replace("#cases"); return; }
  if(h==="top") return viewTop();
  if(h==="runner"){ if(document.getElementById("rc")) return; return viewRunner(); }
  if(h==="crash"){ if(document.getElementById("crc")) return; return viewCrash(); }
  if(h==="battles") return viewBattles();
  if(h==="mines") return viewMines();
  if(h==="quests") return viewQuests();
  if(h==="trades") return viewTrades();
  if(h.startsWith("trade-new-")) return viewTradeNew(h.slice(10));
  if(h.startsWith("trade-")) return viewTrade(h.slice(6));
  if(h==="contract"){ if(CT.busy && document.getElementById("ct-slots")) return; return viewContract(); }
  if(h.startsWith("battle-")){ if(BT.view && BT.view.id===h.slice(7) && document.getElementById("bv")) return; return viewBattle(h.slice(7)); }
  if(h==="upgrade"){ if(upSpinning && document.getElementById("needle")) return; return viewUpgrade(); }
  if(h==="inventory") return viewInventory();
  if(h.startsWith("case-") && CASE_BY_ID[h.slice(5)]){
    if(spinning && document.getElementById("rolls")) return;
    return viewCase(CASE_BY_ID[h.slice(5)]);
  }
  viewCases();
}
let lastHash = location.hash;
window.addEventListener("hashchange",()=>{ if(location.hash!==lastHash){ lastHash=location.hash; window.scrollTo(0,0); } route(); });

/* ---------- Кнопки шапки ---------- */
document.getElementById("sound").addEventListener("click",()=>{ S.sound=!S.sound; save(); renderHeader(); if(MUS.on || document.getElementById("rc")){ musicStop(); if(S.sound && G && G.state==="run") musicStart(); } });

const editable = t => t && t.closest && t.closest("input,textarea");
["copy","cut"].forEach(ev=>document.addEventListener(ev, e=>{ if(!editable(e.target)) e.preventDefault(); }));
document.addEventListener("contextmenu", e=>{ if(!editable(e.target)) e.preventDefault(); });
document.addEventListener("dragstart", e=>{ if(!editable(e.target)) e.preventDefault(); });
document.addEventListener("selectstart", e=>{ if(!editable(e.target)) e.preventDefault(); });
if(LOCAL_ONLY){ const nt = document.getElementById("nav-top"); if(nt) nt.hidden = true; }
renderHeader();
route();
if(!LOCAL_ONLY) initCloud();
})();
</script>
