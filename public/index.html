async function doUpgrade(){
  if(upSpinning){ upSkip = true; return; }
  const st = upStake(), t = upTarget, ch = upChance();
  if(!st || !t) return;
  audio();
  const win = Math.random() < ch;
  const zone = ch*360;
  const lost = S.inv.filter(i=>upSel.has(i.id));
  S.inv = S.inv.filter(i=>!upSel.has(i.id));
  let got = null;
  if(win){
    const w = WEAR[t.w];
    got = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), c:t.c, s:t.s, w:t.w,
      fl:+(w.min+Math.random()*(w.max-w.min)).toFixed(4), st:false, price:t.price, t:Date.now()};
    S.inv.unshift(got);
    if(!S.stats.best || got.price > S.stats.best.price) S.stats.best = got;
    S.stats.upgWin++;
  }
  S.stats.upg++;
  S.stats.upgStake = Math.round((S.stats.upgStake||0) + st);
  vaultAdd(st);
  if(win) S.stats.upgGot = Math.round((S.stats.upgGot||0) + t.price);
  save();
  upSpinning = true;
  upSkip = false;
  { const go = document.getElementById("up-go"); go.disabled = false; go.textContent = "Пропустить анимацию"; go.classList.add("skip"); }
  document.getElementById("up-fast").disabled = true;
  drawUpTargets();

  // байтовый сценарий: позиции в градусах от начала зоны выигрыша (0 = верх), B = пять полных оборотов
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const plain = reduce || S.fast;
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const inZone = d => zone < 2 ? zone/2 : Math.min(zone-0.4, Math.max(0.4, d));
  const TURNS = 3 + Math.floor(Math.random()*3); // от 3 до 5 оборотов
  const B = upAngle - (upAngle%360) + 360*TURNS;
  const D = reduce ? 400 : (S.fast ? 1600 : rnd(6000,7000) + TURNS*500);
  const outQuint = k=>1-Math.pow(1-k,5), outQuart = k=>1-Math.pow(1-k,4), inOut = k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  // варианты идут строго по кругу; позиция в круге хранится в профиле
  const W4 = ["clean","edge","back","reach"], L4 = ["miss","far","creep","slow"];
  const nextInCycle = (key, list) => { const i = (S[key]|0) % list.length; S[key] = (i+1) % list.length; return list[i]; };
  let mode = plain ? (win ? "clean" : "miss") : win ? nextInCycle("upWinIdx", W4) : nextInCycle("upLoseIdx", L4);
  if(!plain) save();
  const E = Math.random()<.5 ? outQuart : outQuint;
  // точка в зоне проигрыша: доля 0..1 от отрезка между краями зоны с отступом 20° (или меньше, если отрезок короткий)
  const lossAt = f => { const region = 360 - zone, m = Math.min(20, region/3); return zone + m + f*(region - 2*m); };
  const segs = {
    // выигрыш
    clean: [{to:B+inZone(rnd(zone*0.25, zone*0.75)), d:D, e:E}],                                                                        // спокойно в зоне
    edge:  [{to:B+inZone(Math.random()<.5 ? zone-rnd(0.4,1.8) : rnd(0.4,1.8)), d:D+rnd(400,900), e:outQuint}, {hold:rnd(120,260)}],      // на самом краю внутри
    back:  [{to:B+zone+rnd(1,3.5), d:D, e:outQuint}, {hold:rnd(400,650)}, {to:B+inZone(zone-rnd(0.5,2)), d:rnd(700,950), e:inOut}],     // проскочила и откатилась
    reach: [{to:B-rnd(1,3.5), d:D, e:outQuint}, {hold:rnd(450,700)}, {to:B+inZone(rnd(0.4,1.6)), d:rnd(900,1250), e:inOut}],           // встала перед зоной и дотянула
    // проигрыш: стрелка всегда встаёт не ближе 20° к зоне выигрыша
    miss:  [{to:B+lossAt(rnd(0.15,0.85)), d:D, e:E}],                                                                        // спокойно мимо
    far:   [{to:B+lossAt(rnd(0.42,0.58)), d:D+rnd(200,500), e:outQuint}],                                                     // напротив зоны
    creep: [{to:B+lossAt(rnd(0.15,0.45)), d:D, e:outQuint}, {hold:rnd(300,450)}, {to:B+lossAt(rnd(0.55,0.8)), d:rnd(700,950), e:inOut}], // встала и проползла дальше, прочь от зоны
    slow:  [{to:B+lossAt(rnd(0.3,0.7)), d:D+rnd(700,1100), e:outQuint}]                                                      // долгое плавное замедление
  }[mode];
  const gauge = document.getElementById("up-mid");
  if(gauge) gauge.classList.remove("won-fx","lost-fx");
  await new Promise(res=>{
    let x = upAngle, seg = 0, t0 = null, from = x, last = performance.now(), lastSeg = Math.floor(x/12);
    function frame(now){
      if(upSkip){
        x = [...segs].reverse().find(g=>g.to!==undefined).to;
        const n = document.getElementById("needle");
        if(n) n.setAttribute("transform", `rotate(${(x%360).toFixed(2)} 150 150)`);
        const gm = document.getElementById("up-mid"); if(gm) gm.classList.remove("tense");
        upAngle = x; res(); return;
      }
      const dt = Math.max(1, now-last); last = now;
      if(t0===null){ t0 = now; from = x; }
      const g = segs[seg], el = now - t0, px = x;
      let doneSeg = false;
      if(g.hold){ if(el >= g.hold) doneSeg = true; }
      else { const k = Math.min(1, el/g.d); x = from + (g.to-from)*g.e(k); if(k>=1) doneSeg = true; }
      const n = document.getElementById("needle");
      if(n) n.setAttribute("transform", `rotate(${(x%360).toFixed(2)} 150 150)`);
      const speed = Math.abs(x-px)/dt*16.7;
      const gm = document.getElementById("up-mid");
      if(gm) gm.classList.toggle("tense", !plain && speed < 1.6 && seg < segs.length);
      const sg = Math.floor(x/12);
      if(sg!==lastSeg){ lastSeg = sg; if(!S.fast) beep(speed < 2 ? 1900 : 1300, .022, speed < 2 ? .045 : .028); }
      if(doneSeg){ seg++; t0 = now; from = x; if(seg < segs.length && segs[seg].hold && !S.fast) beep(80,.22,.07,"sine"); }
      if(seg < segs.length) requestAnimationFrame(frame); else { upAngle = x; res(); }
    }
    requestAnimationFrame(frame);
  });
  if(!isFinite(upAngle)) upAngle = 0;
  // эффект остановки
  const gm = document.getElementById("up-mid");
  if(gm){
    gm.classList.remove("tense");
    gm.classList.add(win ? "won-fx" : "lost-fx");
    if(win && !reduce){
      const col = RAR[skinOf(got).rar].color;
      for(let k=0;k<28;k++){
        const sp = document.createElement("i"); sp.className = "spark";
        const ang = Math.random()*Math.PI*2, dist = 90 + Math.random()*120;
        sp.style.setProperty("--dx", Math.cos(ang)*dist+"px"); sp.style.setProperty("--dy", Math.sin(ang)*dist+"px"); sp.style.setProperty("--sc", k%3 ? col : "#ffc800");
        gm.appendChild(sp);
      }
    }
  }
  if(got) winSound(skinOf(got).rar); else beep(160,.35,.05,"sawtooth");
  await new Promise(r=>setTimeout(r, reduce || upSkip ? 150 : (S.fast ? 400 : 1000)));
  upSkip = false;
  { const go = document.getElementById("up-go"); if(go) go.classList.remove("skip"); }
  upSpinning = false;
  { const f=document.getElementById("up-fast"); if(f) f.disabled=false; }
  upSel.clear(); upTarget = null;
  upLast = {win, st, ch, got};
  if(got){ S.recent = [got].concat(S.recent).slice(0,14); save(); }
  renderHeader();
  if(document.getElementById("up-mid")){ drawUpInv(); drawUpTargets(); drawUpMid(); }
}


/* ---------- Вид: забег (заработок) ---------- */
let RUB_PER_POINT = 0.5;
function rateText(){ const r = RUB_PER_POINT; return r >= 1 ? `1 очко = ${String(+r.toFixed(2)).replace(".",",")} ₽` : `${Math.round(1/r)} очк. = 1 ₽`; }
let GW = 900; const GH = 260, GROUND = 222, PX = 80;
const KX = () => GW/900; // масштаб скорости и расстояний на узком поле
let G = null, runLoop = 0;

function viewRunner(){
  const app = document.getElementById("app");
  GW = window.innerWidth < 640 ? 520 : 900;
  app.innerHTML = `
    <div class="view-head">
      <div><h1>Заработать</h1><p class="sub">${rateText()}. Деньги зачисляются после забега.</p></div>
      <div class="run-stats">
        <div class="stat"><small>Рекорд</small><b class="num" id="run-best">${Math.floor(S.stats.runBest)}</b></div>
        <div class="stat"><small>Забегов</small><b class="num" id="run-n">${S.stats.runs}</b></div>
        <div class="stat"><small>Заработано всего</small><b class="num" id="run-earned">${money(S.stats.runEarned)}</b></div>
      </div>
    </div>
    <section class="panel runner"><canvas id="rc" width="${GW}" height="${GH}" aria-label="Игра: бегущий кейс. Пробел — прыжок, стрелка вниз — пригнуться."></canvas></section>
    <p class="hint" style="margin-top:12px"><kbd>Пробел</kbd> прыжок · <kbd>↓</kbd> пригнуться · на телефоне тап сверху или снизу поля</p>
    <div id="mus"></div>`;
  drawMusicCtl();
  newGame();
  const cv = document.getElementById("rc");
  cv.addEventListener("pointerdown", e=>{
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    if(G.state!=="run" || (e.clientY - r.top) < r.height*0.55) press(); else { G.duck = true; if(!G.ground) G.vy += 4; }
  });
  const up = ()=>{ G.duck = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointerleave", up); cv.addEventListener("pointercancel", up);
  const id = ++runLoop; let last = performance.now();
  function frame(now){
    if(id!==runLoop || !document.body.contains(cv)){ musicStop(); if(G && G.state==="run") endGame(); return; }
    const dt = Math.min(3, (now-last)/16.667); last = now;
    if(G.state==="run") step(dt);
    draw(cv.getContext("2d"), now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function newGame(){
  G = {state:"ready", speed:7, score:0, obs:[], y:0, vy:0, ground:true, duck:false, next:500, dist:0, overAt:0, earned:0, milestone:100,
       city: Array.from({length:22},(_,i)=>({x:i*48, w:28+Math.random()*30, h:30+Math.random()*70}))};
}
function press(){
  if(!G) return;
  if(G.state==="ready"){ G.state="run"; audio(); musicStart(); return; }
  if(G.state==="over"){ if(performance.now()-G.overAt>450){ newGame(); G.state="run"; musicStart(); } return; }
  if(G.ground && !G.duck){ G.vy = -15.2; G.ground = false; beep(520,.07,.03,"triangle"); }
}
window.addEventListener("keydown", e=>{
  if(!document.getElementById("rc") || !G) return;
  if(document.getElementById("overlay").classList.contains("show")) return;
  if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){ e.preventDefault(); if(!e.repeat) press(); }
  else if(e.code==="ArrowDown" || e.code==="KeyS"){ e.preventDefault(); G.duck = true; if(!G.ground) G.vy += 4; }
});
window.addEventListener("keyup", e=>{ if(G && (e.code==="ArrowDown" || e.code==="KeyS")) G.duck = false; });

function playerBox(){
  const h = G.duck && G.ground ? 30 : 48, w = G.duck && G.ground ? 58 : 44;
  return {x:PX, y:GROUND - h + G.y, w, h};
}
function spawn(){
  const sc = G.score, r = Math.random();
  let o;
  if(sc > 250 && r < 0.22){
    const low = Math.random() < 0.55;
    o = {t:"drone", w:46, h:22, y: low ? GROUND-34-22 : GROUND-78-22};
  } else if(r < 0.42){
    o = {t:"wire", w:70, h:18, y:GROUND-18};
  } else if(r < 0.62){
    o = {t:"tall", w:32, h:56, y:GROUND-56};
  } else if(r < 0.82 && sc > 120){
    o = {t:"crate2", w:66, h:34, y:GROUND-34};
  } else {
    o = {t:"crate", w:32, h:34, y:GROUND-34};
  }
  o.x = GW + 20;
  G.obs.push(o);
  G.next = (300 + Math.random()*320 + G.speed*16)*KX();
}
function step(dt){
  G.speed = Math.min(17, G.speed + 0.0028*dt);
  const dx = G.speed*KX()*dt;
  G.dist += dx;
  G.score += G.speed*dt*0.022;
  if(G.score >= G.milestone){ G.milestone += 100; beep(990,.09,.03,"triangle"); }
  // физика прыжка
  if(!G.ground){
    G.vy += (G.duck ? 1.9 : 0.85)*dt;
    G.y += G.vy*dt;
    if(G.y >= 0){ G.y = 0; G.vy = 0; G.ground = true; }
  }
  // препятствия
  G.next -= dx;
  if(G.next <= 0) spawn();
  G.obs.forEach(o=>{ o.x -= dx * (o.t==="drone" ? 1.12 : 1); });
  G.obs = G.obs.filter(o=>o.x + o.w > -20);
  G.city.forEach(b=>{ b.x -= dx*0.18; if(b.x + b.w < 0){ b.x += 22*48; b.h = 30+Math.random()*70; } });
  // столкновения
  const p = playerBox(), m = 6;
  for(const o of G.obs){
    const om = o.t==="wire" ? 8 : 4;
    if(p.x+m < o.x+o.w-om && p.x+p.w-m > o.x+om && p.y+m < o.y+o.h-om && p.y+p.h-m > o.y+om){ endGame(); break; }
  }
}
function endGame(){
  G.state = "over"; G.overAt = performance.now();
  G.earned = Math.floor(G.score*RUB_PER_POINT);
  S.bal = Math.round(S.bal + G.earned);
  S.stats.runs++; S.stats.runEarned += G.earned;
  if(G.score > S.stats.runBest) S.stats.runBest = G.score;
  save(); renderHeader();
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set("run-best", Math.floor(S.stats.runBest)); set("run-n", S.stats.runs); set("run-earned", money(S.stats.runEarned));
  beep(150,.3,.05,"sawtooth");
}

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function drawRunner(ctx, now){
  const p = playerBox(), run = G.state==="run" && G.ground;
  const legH = G.duck && G.ground ? 6 : 10, bodyH = p.h - legH;
  const phase = Math.floor(G.dist/22) % 2;
  // ноги
  ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 5; ctx.lineCap = "round";
  const ly = p.y + bodyH, lx1 = p.x + p.w*0.3, lx2 = p.x + p.w*0.7;
  ctx.beginPath();
  if(!G.ground){ ctx.moveTo(lx1,ly); ctx.lineTo(lx1-4,ly+legH-3); ctx.moveTo(lx2,ly); ctx.lineTo(lx2-4,ly+legH-3); }
  else if(run){ const a = phase ? 5 : -5; ctx.moveTo(lx1,ly); ctx.lineTo(lx1+a,ly+legH); ctx.moveTo(lx2,ly); ctx.lineTo(lx2-a,ly+legH); }
  else { ctx.moveTo(lx1,ly); ctx.lineTo(lx1,ly+legH); ctx.moveTo(lx2,ly); ctx.lineTo(lx2,ly+legH); }
  ctx.stroke();
  // ручка
  ctx.strokeStyle = "#ffc800"; ctx.lineWidth = 3;
  rr(ctx, p.x + p.w/2 - 8, p.y - 6, 16, 9, 3); ctx.stroke();
  // корпус
  ctx.fillStyle = "#ffc800"; rr(ctx, p.x, p.y, p.w, bodyH, 6); ctx.fill();
  ctx.fillStyle = "#c99a00"; rr(ctx, p.x, p.y, p.w, Math.max(8,bodyH*0.3), 5); ctx.fill();
  // замок-«глаз»
  ctx.fillStyle = "#1a1204"; rr(ctx, p.x + p.w - 17, p.y + bodyH*0.38, 10, 10, 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillRect(p.x + p.w - 12, p.y + bodyH*0.38 + 2, 3, 3);
  if(G.state==="over"){ ctx.strokeStyle="#ef5350"; ctx.lineWidth=2; const ex=p.x+p.w-17, ey=p.y+bodyH*0.38; ctx.beginPath(); ctx.moveTo(ex+1,ey+1); ctx.lineTo(ex+9,ey+9); ctx.moveTo(ex+9,ey+1); ctx.lineTo(ex+1,ey+9); ctx.stroke(); }
}
function drawObs(ctx, o, now){
  if(o.t==="crate" || o.t==="crate2" || o.t==="tall"){
    const n = o.t==="crate2" ? 2 : 1, w = o.w/n;
    for(let i=0;i<n;i++){
      const x = o.x + i*w;
      ctx.fillStyle = "#7a4f27"; ctx.fillRect(x, o.y, w-2, o.h);
      ctx.strokeStyle = "#4a2f16"; ctx.lineWidth = 2; ctx.strokeRect(x+1, o.y+1, w-4, o.h-2);
      ctx.beginPath(); ctx.moveTo(x+3,o.y+3); ctx.lineTo(x+w-5,o.y+o.h-3); ctx.moveTo(x+w-5,o.y+3); ctx.lineTo(x+3,o.y+o.h-3); ctx.stroke();
    }
  } else if(o.t==="wire"){
    ctx.strokeStyle = "#8a96a7"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(o.x+4,GROUND); ctx.lineTo(o.x+4,o.y); ctx.moveTo(o.x+o.w-4,GROUND); ctx.lineTo(o.x+o.w-4,o.y); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath();
    for(let i=0;i<=14;i++){ const x=o.x+4+i*(o.w-8)/14, y=o.y+3+(i%2?8:0); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
  } else if(o.t==="drone"){
    ctx.fillStyle = "#3a3a3a"; rr(ctx, o.x+6, o.y+6, o.w-12, o.h-8, 5); ctx.fill();
    ctx.strokeStyle = "#8a96a7"; ctx.lineWidth = 2;
    const f = Math.floor(now/60)%2 ? 9 : 5;
    ctx.beginPath(); ctx.moveTo(o.x+10-f,o.y+3); ctx.lineTo(o.x+10+f,o.y+3); ctx.moveTo(o.x+o.w-10-f,o.y+3); ctx.lineTo(o.x+o.w-10+f,o.y+3);
    ctx.moveTo(o.x+10,o.y+3); ctx.lineTo(o.x+10,o.y+8); ctx.moveTo(o.x+o.w-10,o.y+3); ctx.lineTo(o.x+o.w-10,o.y+8); ctx.stroke();
    ctx.fillStyle = Math.floor(now/300)%2 ? "#ef5350" : "#7a1f1f"; ctx.beginPath(); ctx.arc(o.x+o.w/2, o.y+o.h-5, 3, 0, 7); ctx.fill();
  }
}
function draw(ctx, now){
  ctx.clearRect(0,0,GW,GH);
  const g = ctx.createLinearGradient(0,0,0,GROUND); g.addColorStop(0,"#121212"); g.addColorStop(1,"#1d1d1d");
  ctx.fillStyle = g; ctx.fillRect(0,0,GW,GROUND);
  ctx.fillStyle = "#242424"; G.city.forEach(b=>ctx.fillRect(b.x, GROUND-b.h, b.w, b.h));
  ctx.fillStyle = "#101010"; ctx.fillRect(0,GROUND,GW,GH-GROUND);
  ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,GROUND+1); ctx.lineTo(GW,GROUND+1); ctx.stroke();
  ctx.fillStyle = "#2c2c2c"; const off = G.dist % 60;
  for(let x=-off; x<GW; x+=60){ ctx.fillRect(x, GROUND+10, 18, 2); ctx.fillRect(x+33, GROUND+22, 8, 2); }
  G.obs.forEach(o=>drawObs(ctx,o,now));
  drawRunner(ctx, now);
  // HUD
  ctx.textAlign = "right"; ctx.fillStyle = "#e8edf3"; ctx.font = "20px \'Tiny5 Duo\', monospace";
  ctx.fillText(String(Math.floor(G.score)).padStart(5,"0"), GW-18, 32);
  ctx.fillStyle = "#3ecf6e"; ctx.font = "15px \'Tiny5 Duo\', monospace";
  ctx.fillText("+" + Math.floor(G.score*RUB_PER_POINT).toLocaleString("ru-RU") + " ₽", GW-18, 54);
  ctx.fillStyle = "#8a96a7"; ctx.font = "13px \'Tiny5 Duo\', monospace";
  ctx.fillText("рекорд " + Math.floor(S.stats.runBest), GW-18, 74);
  ctx.textAlign = "center";
  if(G.state==="ready"){
    ctx.fillStyle = "#e8edf3"; ctx.font = (GW<700?"17px":"26px")+" \'Tiny5 Duo\', monospace"; ctx.fillText(GW<700 ? "Тапните, чтобы начать" : "Нажмите пробел или тапните, чтобы начать", GW/2, 104);
    ctx.fillStyle = "#8a96a7"; ctx.font = (GW<700?"12px":"15px")+" \'Tiny5 Duo\', monospace"; ctx.fillText(rateText() + (GW<700 ? "" : ". Скорость растёт со временем."), GW/2, 132);
  } else if(G.state==="over"){
    ctx.fillStyle = "rgba(15,15,15,.8)"; ctx.fillRect(GW/2-Math.min(230,GW/2-10), 62, Math.min(460,GW-20), 108);
    ctx.fillStyle = "#e8edf3"; ctx.font = "28px \'Tiny5 Duo\', monospace"; ctx.fillText("Забег окончен", GW/2, 98);
    ctx.fillStyle = "#3ecf6e"; ctx.font = (GW<700?"15px":"20px")+" \'Tiny5 Duo\', monospace"; ctx.fillText(Math.floor(G.score) + " очков  ·  +" + G.earned.toLocaleString("ru-RU") + " ₽ на баланс", GW/2, 128);
    ctx.fillStyle = "#8a96a7"; ctx.font = "14px \'Tiny5 Duo\', monospace"; ctx.fillText("Пробел или тап — ещё раз", GW/2, 154);
  }
}

const CL = {db:null, id:null, status:"local", list:[], loaded:false, slow:false, err:false};
let lastGame = "", lastPub = "", wBusy = false, wDirty = false, wTimer = 0;
function pubItem(it){ return it ? {c:it.c, s:it.s, w:it.w, st:!!it.st, price:it.price, fl:it.fl} : null; }
function pubDrop(it){ return Object.assign(pubItem(it), {id:String(it.id||"").slice(0,24), t:+it.t||0}); }
function showcase(st){ return st.inv.slice().sort((a,b)=>b.price-a.price).slice(0,3).map(pubItem); }
function worthOf(st){ return Math.round(st.bal + st.inv.reduce((a,i)=>a+i.price,0)); }
function publicProfile(){
  const xp = xpOf(S), t = S.stats;
  return {nick:S.profile.nick, av:{g:S.profile.av.g|0, c:S.profile.av.c|0}, img:validImg(S.profile.img)?S.profile.img:"", xp, lvl:levelOf(xp).lvl, worth:worthOf(S), bal:Math.round(S.bal),
    opened:t.opened, upg:t.upg, upgWin:t.upgWin, runs:t.runs, runBest:Math.floor(t.runBest), runEarned:t.runEarned,
    vault:vaultLocks(),
    rtp:{c:t.byCase, us:t.upgStake||0, ug:t.upgGot||0, cs:(t.crash&&t.crash.bet)||0, cg:(t.crash&&t.crash.got)||0},
    best:pubItem(t.best), show:showcase(S), drops:S.recent.slice(0,10).map(pubDrop)};
}
function cleanProfile(id, d){
  if(!d || typeof d!=="object") return null;
  const n = v => { v = Number(v); return isFinite(v) && v>=0 ? v : 0; };
  const item = it => (it && validItem({...it, price:n(it.price), fl:n(it.fl)})) ? {c:it.c, s:it.s|0, w:it.w|0, st:!!it.st, price:n(it.price), fl:n(it.fl)} : null;
  return {id, nick:String(d.nick||"Игрок").slice(0,20), av:{g:(d.av&&d.av.g)|0, c:(d.av&&d.av.c)|0}, img:validImg(d.img)?d.img:"", xp:n(d.xp), lvl:Math.max(1,n(d.lvl)|0),
    worth:n(d.worth), bal:n(d.bal), opened:n(d.opened), upg:n(d.upg), upgWin:n(d.upgWin), runs:n(d.runs), runBest:n(d.runBest), runEarned:n(d.runEarned), vault:Math.min(999, n(d.vault)|0),
    rtp:(()=>{ const r = d.rtp && typeof d.rtp==="object" ? d.rtp : {}; const c = {};
      if(r.c && typeof r.c==="object") Object.entries(r.c).forEach(([k,v])=>{ if(CASE_BY_ID[k] && Array.isArray(v)) c[k] = [n(v[0]), n(v[1]), n(v[2])]; });
      return {c, us:n(r.us), ug:n(r.ug), cs:n(r.cs), cg:n(r.cg)}; })(),
    best:item(d.best), show:Array.isArray(d.show) ? d.show.map(item).filter(Boolean).slice(0,3) : [],
    drops:Array.isArray(d.drops) ? d.drops.slice(0,10).map(x=>{ const it=item(x); if(!it) return null; it.id=String(x.id||"").replace(/[^a-z0-9]/gi,"").slice(0,24)||Math.random().toString(36).slice(2,8); it.t=n(x.t); return it; }).filter(Boolean) : []};
}
function setStatus(st){ CL.status = st; renderHeader(); if(location.hash==="#profile") drawSync(); }

async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    CL.db = db; CL.id = id; setStatus("sync");
    try{ let o = user.isOwner(); if(o && typeof o.then==="function") o = await o; CL.owner = !!o; }catch(e){ CL.owner = false; }
    document.getElementById("nav-admin").hidden = !CL.owner;
    subscribeConfig();
    subscribeTop();
    subscribeFeed();
    btInitSettle();
    const ref = db.collection("data/users/"+id).doc("game");
    let snap;
    try{
      snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    }catch(e){ setStatus("error"); return; }
    if(snap.exists){
      const d = snap.data();
      try{
        const remote = JSON.parse(d.state);
        const keep = {sound:S.sound, fast:S.fast, n:S.n};
        S = Object.assign(fresh(), remote, keep); normalize();
        S.lastLvl = Math.max(S.lastLvl||1, levelOf(xpOf(S)).lvl);
        lastGame = d.state;
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      }catch(e){}
    }
    if(!snap.exists){
      // новый аккаунт: вместо случайного «Игрок-1234» ставим имя из аккаунта
      try{ const m = user.me ? await user.me() : null; const nm = m && String(m.name||"").trim().slice(0,20);
        if(nm && nm.length>=2 && /^Игрок-\d+$/.test(S.profile.nick)) S.profile.nick = nm; }catch(e){}
    }
    setStatus("ok");
    renderHeader(); if(!spinning && !upSpinning) route();
    flushCloud();
    subscribeGrants();
  }catch(e){ /* облако недоступно: остаёмся в локальном режиме */ }
}
function scheduleCloud(){
  if(!CL.id || CL.status==="sync" || CL.status==="readonly") return;
  clearTimeout(wTimer); wTimer = setTimeout(flushCloud, 1200);
}
async function flushCloud(){
  if(!CL.id || CL.status==="readonly") return;
  if(wBusy){ wDirty = true; return; }
  wBusy = true; wDirty = false;
  try{
    const game = JSON.stringify(Object.assign({}, S, {sound:undefined, fast:undefined, n:undefined}));
    if(game !== lastGame){ await CL.db.collection("data/users/"+CL.id).doc("game").set({state:game, ts:Date.now()}); lastGame = game; }
    const pub = publicProfile(), pubStr = JSON.stringify(pub);
    if(!S.hidden && pubStr !== lastPub){ await CL.db.doc("profiles/"+CL.id).set(Object.assign({ts:Date.now()}, pub)); lastPub = pubStr; }
    if(CL.status!=="ok") setStatus("ok");
  }catch(e){
    const code = e && e.code;
    if(code==="invalid_argument") setStatus("readonly");
    else if(code==="quota_exceeded") setStatus("quota");
    else if(code==="revoked") setStatus("error");
    else { setStatus("error"); setTimeout(()=>{ if(CL.status==="error") flushCloud(); }, 8000+Math.random()*4000); }
  }
  wBusy = false;
  if(wDirty) flushCloud();
}
function subscribeFeed(){
  CL.db.doc("feed/main").onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data(), n = v => { v = Number(v); return isFinite(v) && v>=0 ? v : 0; };
    CL.feed = (Array.isArray(d.items) ? d.items : []).slice(0, 40).map(x=>{
      if(!x || !x.d) return null;
      const it = {c:String(x.d.c||""), s:x.d.s|0, w:x.d.w|0, st:!!x.d.st, price:n(x.d.price), fl:n(x.d.fl), t:n(x.d.t), id:String(x.d.id||"").replace(/[^a-z0-9]/gi,"").slice(0,24) || Math.random().toString(36).slice(2,8)};
      return validItem(it) ? {pid:String(x.pid||""), nick:String(x.nick||"Игрок").slice(0,20), av:{g:(x.av&&x.av.g)|0, c:(x.av&&x.av.c)|0}, d:it} : null;
    }).filter(Boolean);
    renderFeed();
  }, ()=>{});
}
function subscribeTop(){
  const timer = setTimeout(()=>{ if(!CL.loaded){ CL.slow = true; if(location.hash==="#top") drawBoard(); } }, 10000);
  CL.db.collection("profiles").limit(1000).onSnapshot(q=>{
    CL.list = q.docs.filter(d=>d.exists).map(d=>cleanProfile(d.id, d.data())).filter(Boolean);
    if(!q.metadata.fromCache){ CL.loaded = true; CL.slow = false; clearTimeout(timer); }
    if(location.hash==="#top") drawBoard();
    renderFeed();
    if(location.hash==="#admin") drawAdminPlayers();
  }, ()=>{ CL.err = true; clearTimeout(timer); if(location.hash==="#top") drawBoard(); });
}

/* ---------- Лента последних дропов всех игроков ---------- */
const FEED_MAX = 30;
let feedSeen = null, feedSig = "";
function feedItems(){
  const me = {id:CL.id||"me", nick:S.profile.nick, av:S.profile.av, img:S.profile.img};
  let all = S.recent.slice(0,10).map(it=>({it, who:me}));
  if(CL.id && CL.feed){
    // сервер ведёт общую ленту: берём из неё всех, кроме себя (свои дропы видны сразу)
    CL.feed.forEach(x=>{ if(x.pid===CL.id) return; const p = CL.list.find(q=>q.id===x.pid); all.push({it:x.d, who: p || {id:x.pid, nick:x.nick, av:x.av}}); });
  } else if(CL.id){
    CL.list.forEach(p=>{ if(p.id===CL.id) return; (p.drops||[]).forEach(it=>all.push({it, who:p})); });
  }
  all.sort((a,b)=>(b.it.t||0)-(a.it.t||0));
  return all.slice(0, FEED_MAX);
}
function renderFeed(){
  const feed = document.getElementById("feed"); if(!feed) return;
  const items = feedItems();
  const keys = items.map(x=>x.who.id+":"+x.it.id);
  const live = CL.status==="ok";
  const sig = keys.join("|") + "|" + live + "|" + S.profile.nick + "|" + (S.profile.img||"").length + S.profile.av.g + S.profile.av.c;
  if(sig === feedSig) return;
  feedSig = sig;
  const first = feedSeen === null;
  const seen = feedSeen || new Set();
  feed.innerHTML = `<span class="feed-label">${live?'<i class="live-dot" aria-hidden="true"></i>Последние дропы':'Ваши дропы'}</span>` + (items.length
    ? items.map((x,i)=>{
        const it = x.it, sk = skinOf(it), k = keys[i], fresh = !first && !seen.has(k);
        return `<div class="drop${fresh?' enter':''}" style="--rc:${RAR[sk.rar].color}" title="${esc(title(sk)+' | '+sk.name)} — ${money(it.price)}">
          ${art(sk)}<em class="d-price">${money(it.price)}</em>
          <span><b>${esc(sk.name)}</b>${it.st?'ST ':''}${esc(title(sk))}</span>
          <i class="d-who">${avatarOf(x.who,14)}<span>${esc(x.who.nick)}</span></i></div>`;
      }).join("")
    : '<span class="feed-empty">Здесь появятся последние выпавшие предметы.</span>');
  feedSeen = new Set(keys);
}


/* ---------- Общие настройки (их меняет владелец) ---------- */
let CFG = {rtp:0.95, runRate:0.5, upMax:0.90, upEdge:0.95, crashRtp:0.95, dailyBase:50000, vaultRate:100, start:4000, cases:{}, luck:{}, announce:{text:"", on:false, ts:0}, hidden:{}};
function applyConfig(raw){
  const c = raw || {};
  const n = (v,lo,hi,d)=>{ v = Number(v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  const obj = v => v && typeof v==="object" && !Array.isArray(v) ? v : {};
  const an = obj(c.announce);
  CFG = {rtp:n(c.rtp,.3,.99,.95), runRate:n(c.runRate,.05,10,.5), upMax:n(c.upMax,.05,.95,.90), upEdge:n(c.upEdge,.3,1,.95), crashRtp:n(c.crashRtp,.3,.99,.95), dailyBase:Math.round(n(c.dailyBase,0,1e7,50000)), vaultRate:n(c.vaultRate,1,1e6,100),
    start:Math.round(n(c.start,0,1e7,4000)), cases:obj(c.cases), hidden:obj(c.hidden),
    luck:Object.fromEntries(Object.entries(obj(c.luck)).filter(([k,v])=>typeof k==="string" && isFinite(Number(v)) && Number(v)>0 && Number(v)!==1).map(([k,v])=>[k, Math.min(5, Math.max(0.1, Number(v)))])),
    announce:{text:String(an.text||"").slice(0,300), on:!!an.on, ts:Number(an.ts)||0}};
  RTP = CFG.rtp; RUB_PER_POINT = CFG.runRate; UP_MAX = CFG.upMax; UP_EDGE = CFG.upEdge; CRASH_RTP = CFG.crashRtp; DAILY_BASE = CFG.dailyBase; VAULT_RATE = CFG.vaultRate; START = CFG.start;
  CASES.forEach(cs=>{ const o = obj(CFG.cases[cs.id]); cs.price = Math.round(n(o.price,1,1e7,cs.defPrice)); cs.off = !!o.off; cs.isNew = o.isNew===undefined ? cs.defNew : !!o.isNew; const r = Number(o.rtp); cs.rtp = isFinite(r) && r>=0.3 && r<=0.99 ? r : null; });
  recomputeCases(); buildCatalog();
}
function subscribeConfig(){
  let first = true;
  CL.db.doc("config/main").onSnapshot(snap=>{
    const sig = JSON.stringify(snap.exists ? snap.data() : {});
    if(sig === CL.cfgSig) return;
    CL.cfgSig = sig;
    applyConfig(snap.exists ? snap.data() : {});
    renderAnnounce();
    const h = location.hash.slice(1);
    if(!first && h!=="admin" && h!=="profile" && h!=="runner" && !spinning && !upSpinning) route();
    if(first && !spinning && !upSpinning && h!=="admin") route();
    if(h==="admin" && first) route();
    first = false;
  }, ()=>{});
}
function renderAnnounce(){
  const el = document.getElementById("announce"); if(!el) return;
  const a = CFG.announce;
  if(!a.on || !a.text || S.annDismiss===a.ts){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<span class="ann-ico" aria-hidden="true">!</span><span class="ann-t"></span><button class="icon-btn btn" id="ann-x" aria-label="Скрыть объявление">✕</button>`;

}

/* ---------- Почтовый ящик игрока: начисления и команды от владельца ---------- */
function subscribeGrants(){
  CL.db.doc("grants/"+CL.id).onSnapshot(snap=>{
    if(!snap.exists) return;
    const ops = Array.isArray(snap.data().ops) ? snap.data().ops : [];
    let changed = false;
    ops.forEach(op=>{
      if(!op || typeof op.id!=="string" || S.applied.includes(op.id)) return;
      S.applied.push(op.id); changed = true;
      if(op.type==="money"){
        const a = Math.round(Number(op.amount)||0);
        S.bal = Math.max(0, Math.round(S.bal + a));
        toast(a>=0 ? `Администратор начислил вам ${money(a)}` : `Администратор списал ${money(-a)}`);
      } else if(op.type==="reset"){
        S.profile.nick = newProfile().nick; S.profile.img = "";
        toast("Администратор сбросил ваш ник и аватар");
      } else if(op.type==="hide"){
        S.hidden = true; lastPub = "";
        CL.db.doc("profiles/"+CL.id).delete().catch(()=>{});
        toast("Ваш профиль скрыт из рейтинга");
      } else if(op.type==="show"){
        S.hidden = false; lastPub = "";
        toast("Ваш профиль снова в рейтинге");
      }
    });
    if(changed){ S.applied = S.applied.slice(-100); save(); renderHeader(); if(!spinning && !upSpinning && location.hash!=="#runner" && location.hash!=="#crash" && !BT.anim && !location.hash.startsWith("#battle")) route(); }
  }, ()=>{});
}

let cfgBusy = Promise.resolve();
function saveConfig(patch){
  const next = Object.assign({}, CFG, patch);
  cfgBusy = cfgBusy.catch(()=>{}).then(()=>CL.db.doc("config/main").set(next)).then(()=>{ applyConfig(next); CL.cfgSig = JSON.stringify(next); renderAnnounce(); });
  return cfgBusy;
}
const opChains = {};
function sendOp(id, op){
  const run = async ()=>{
    const ref = CL.db.doc("grants/"+id);
    const snap = await ref.get();
    const ops = snap.exists && Array.isArray(snap.data().ops) ? snap.data().ops.slice(-29) : [];
    ops.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), ts:Date.now()}, op));
    await ref.set(Object.assign({}, snap.exists ? snap.data() : {}, {ops}));
  };
  opChains[id] = (opChains[id]||Promise.resolve()).catch(()=>{}).then(run);
  return opChains[id];
}

/* ---------- Вид: краш ----------
 * Множитель растёт от 1,00×, пока не «крашнется». Точка краша выбирается в начале раунда:
 * P(краш ≥ x) = RTP / x, поэтому при любой стратегии средняя отдача равна RTP краша (× удача игрока). */
const CR_K = 0.1; // скорость роста: ×2 примерно за 7 секунд, ×10 — за 23
const crMult = ms => Math.floor(Math.exp(CR_K*ms/1000)*100)/100;
const crTime = m => Math.log(m)/CR_K*1000;
const fx = m => m.toFixed(2).replace(".",",")+"×";
const CR = {state:"idle", bet:0, point:0, t0:0, auto:0, at:0, loop:0};
function crashPoint(){
  const R = Math.min(5, CRASH_RTP*myLuck()), u = Math.random();
  return Math.min(10000, Math.max(1, Math.floor(R/(1-u)*100)/100));
}
function crStats(){ S.stats.crash = Object.assign({n:0, bet:0, got:0, best:0}, S.stats.crash||{}); return S.stats.crash; }
function crHist(){ if(!Array.isArray(S.crHist)) S.crHist = []; return S.crHist; }
function crStart(){
  if(CR.state==="run") return;
  const inp = document.getElementById("cr-bet"), ain = document.getElementById("cr-auto");
  const bet = Math.floor(Number(String(inp.value).replace(",", ".")));
  const auto = Number(String(ain.value).replace(",", "."));
  const msg = document.getElementById("cr-msg");
  if(!(bet>=1)){ msg.textContent = "Введите ставку от 1 ₽"; return; }
  if(bet > S.bal){ msg.textContent = "Не хватает денег на балансе"; return; }
  msg.textContent = "";
  audio();
  S.crBet = bet; S.crAuto = auto>1 ? Math.round(auto*100)/100 : 0;
  S.bal = Math.round((S.bal-bet)*100)/100;
  const st = crStats(); st.n++; st.bet = Math.round(st.bet + bet);
  vaultAdd(bet);
  Object.assign(CR, {state:"run", bet, point:crashPoint(), t0:performance.now(), auto:S.crAuto, at:0});
  save(); renderHeader(); crButtons();
}
function crCash(m){
  if(CR.state!=="run" || !(m>1) || m>=CR.point) return;
  CR.state = "cashed"; CR.at = m;
  const won = Math.round(CR.bet*m);
  S.bal = Math.round((S.bal+won)*100)/100;
  const st = crStats(); st.got = Math.round(st.got + won); if(m > st.best) st.best = m;
  crEnd();
  if(S.sound){ beep(880,.08,.05,"triangle"); setTimeout(()=>beep(1320,.12,.05,"triangle"), 90); }
}
function crBust(){
  if(CR.state!=="run") return;
  CR.state = "crashed"; crEnd();
  if(S.sound) beep(110,.35,.07,"sawtooth");
}
function crEnd(){
  const h = crHist(); h.unshift(CR.point); S.crHist = h.slice(0,14);
  save(); renderHeader(); crButtons(); crDrawHist();
}
/* если игрок ушёл со страницы посреди раунда: автовывод срабатывает, иначе ставка сгорает */
function crLeave(){
  if(CR.state!=="run") return;
  if(CR.auto>1 && CR.auto<CR.point) crCash(CR.auto); else crBust();
}
function crButtons(){
  const b = document.getElementById("cr-go"); if(!b) return;
  const run = CR.state==="run";
  b.classList.toggle("cash", run);
  if(!run) b.textContent = "Поставить";
  document.querySelectorAll("#cr-bet, #cr-auto, .cr-q button").forEach(x=>x.disabled = run);
  const st = crStats();
  const set = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = v; };
  set("cr-n", st.n); set("cr-best", st.best ? fx(st.best) : "—"); set("cr-rtp", st.bet ? Math.round(st.got/st.bet*100)+"%" : "—");
}
function crDrawHist(){
  const box = document.getElementById("cr-hist"); if(!box) return;
  const h = crHist();
  box.innerHTML = h.length ? h.map(x=>`<span class="cr-chip${x>=10?' gold':x>=2?' hi':''}">${fx(x)}</span>`).join("") : `<span class="hint">Здесь будут последние раунды</span>`;
}
function crDraw(cv, now){
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const run = CR.state==="run";
  const tNow = run ? now-CR.t0 : CR.state==="idle" ? 0 : crTime(CR.state==="cashed" ? Math.max(CR.at, 1) : CR.point);
  const tEnd = CR.state==="idle" ? 0 : run ? tNow : crTime(CR.point);
  const mShow = run ? Math.min(crMult(tNow), CR.point) : CR.state==="crashed" ? CR.point : CR.state==="cashed" ? CR.at : 1;
  const tMax = Math.max(8000, tEnd*1.15), mMax = Math.max(2, Math.exp(CR_K*tEnd/1000)*1.2);
  const L = 44, B = 26, T = 14, Rr = 14, pw = W-L-Rr, ph = H-B-T;
  const X = t => L + t/tMax*pw, Y = m => T + ph - (m-1)/(mMax-1)*ph;
  // сетка
  g.font = "11px monospace"; g.fillStyle = "#6b6b6b"; g.strokeStyle = "#262626"; g.lineWidth = 1;
  const step = mMax<=3 ? 0.5 : mMax<=6 ? 1 : mMax<=15 ? 2 : Math.pow(10, Math.floor(Math.log10(mMax)))/2;
  for(let m = 1; m <= mMax; m += step){ const y = Y(m); g.beginPath(); g.moveTo(L,y); g.lineTo(W-Rr,y); g.stroke(); g.fillText(m.toFixed(m%1?1:0)+"×", 4, y+4); }
  const ts = tMax<=12000 ? 2000 : tMax<=30000 ? 5000 : 10000;
  for(let t = ts; t < tMax; t += ts){ g.fillText(Math.round(t/1000)+"с", X(t)-8, H-8); }
  // кривая
  if(CR.state!=="idle"){
    const col = CR.state==="crashed" ? "#ef5350" : CR.state==="cashed" ? "#3ecf6e" : "#ffc800";
    const N = 80, pts = [];
    for(let i=0;i<=N;i++){ const t = tEnd*i/N; pts.push([X(t), Y(Math.exp(CR_K*t/1000))]); }
    const grd = g.createLinearGradient(0,T,0,T+ph); grd.addColorStop(0, col+"55"); grd.addColorStop(1, col+"00");
    g.beginPath(); g.moveTo(X(0), Y(1)); pts.forEach(p=>g.lineTo(p[0],p[1])); g.lineTo(pts[N][0], Y(1)); g.closePath(); g.fillStyle = grd; g.fill();
    g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.strokeStyle = col; g.lineWidth = 3; g.lineJoin = "round"; g.stroke();
    g.beginPath(); g.arc(pts[N][0], pts[N][1], 6, 0, Math.PI*2); g.fillStyle = col; g.fill();
    if(CR.state==="cashed" && CR.at>1){ const x = X(crTime(CR.at)), y = Y(CR.at); g.beginPath(); g.arc(x,y,5,0,Math.PI*2); g.fillStyle="#fff"; g.fill(); }
  }
  // надпись
  const big = document.getElementById("cr-big"), small = document.getElementById("cr-small");
  if(big){
    big.textContent = fx(mShow);
    big.className = "cr-big" + (CR.state==="crashed" ? " bad" : CR.state==="cashed" ? " good" : "");
    small.textContent = CR.state==="crashed" ? "Краш!" : CR.state==="cashed" ? `Забрали на ${fx(CR.at)} · +${money(Math.round(CR.bet*CR.at))}` : run ? (CR.auto>1 ? `автовывод на ${fx(CR.auto)}` : "") : "Сделайте ставку";
  }
}

      <button class="btn primary cr-go" id="cr-go">Поставить</button>
      <span class="hint" id="cr-msg"></span>
    </section>`;
  const bet = document.getElementById("cr-bet"), auto = document.getElementById("cr-auto");
  app.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>{
    const v = Math.floor(Number(bet.value)||0), k = b.dataset.b;
    bet.value = Math.max(1, Math.floor(k==="half" ? v/2 : k==="x2" ? Math.min(v*2, S.bal) : S.bal));
  }));
  app.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{ auto.value = auto.value===b.dataset.a ? "" : b.dataset.a; }));
  document.getElementById("cr-go").addEventListener("click", ()=>{
    if(CR.state==="run") crCash(crMult(performance.now()-CR.t0)); else crStart();
  });
  if(CR.state!=="run") CR.state = "idle";
  crButtons(); crDrawHist();
  const cv = document.getElementById("crc"), id = ++CR.loop;
  let lastTick = 0;
  function frame(now){
    if(id!==CR.loop || !document.body.contains(cv)){ crLeave(); return; }
    if(CR.state==="run"){
      const t = now-CR.t0, m = crMult(t);
      if(CR.auto>1 && CR.auto<CR.point && m>=CR.auto) crCash(CR.auto);
      else if(m>=CR.point) crBust();
      else {
        const b = document.getElementById("cr-go"); if(b) b.textContent = `Забрать ${money(Math.round(CR.bet*m))}`;
        if(S.sound && t-lastTick > 500){ lastTick = t; beep(400+Math.min(800, m*60), .02, .015); }
      }
    }
    crDraw(cv, now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- Ежедневный подарок ----------
 * Раз в календарный день. Серия из 7 дней: награда растёт, пропуск дня сбрасывает серию на первый день. */
const DAILY_MULT = [1, 1.5, 2, 3, 4, 6, 10];
const shortNum = v => v>=1e6 ? (Math.round(v/1e5)/10+"м").replace(".",",") : v>=1000 ? (Math.round(v/100)/10+"к").replace(".",",") : String(Math.round(v));
const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function dailyState(){
  const d = S.daily && typeof S.daily==="object" ? S.daily : {last:"", streak:0};
  const now = new Date(), today = dayKey(now), y = new Date(now); y.setDate(y.getDate()-1);
  const ready = d.last !== today;
  const cont = d.last === dayKey(y) || d.last === today;
  const streak = cont ? (d.streak|0) : 0;                   // сколько дней уже собрано в текущей серии
  const next = ready ? (cont ? streak % 7 : 0) + 1 : streak; // номер дня, который можно забрать (или забран сегодня)
  return {ready, streak: ready && !cont ? 0 : streak, day: next, prize: Math.round(DAILY_BASE * DAILY_MULT[(next-1)%7])};
}
function claimDaily(){
  const st = dailyState(); if(!st.ready || DAILY_BASE<=0) return;
  S.daily = {last: dayKey(new Date()), streak: st.day};
  S.bal = Math.round((S.bal + st.prize)*100)/100;
  S.stats.daily = Math.round((S.stats.daily||0) + st.prize);
  vaultAdd(0, 25);
  save(); renderHeader();
  if(S.sound){ beep(660,.08,.05,"triangle"); setTimeout(()=>beep(990,.08,.05,"triangle"),90); setTimeout(()=>beep(1320,.14,.05,"triangle"),180); }
  drawDaily(true);
}
function untilTomorrow(){
  const now = new Date(), t = new Date(now); t.setHours(24,0,0,0);
  const m = Math.max(1, Math.ceil((t-now)/60000)), h = Math.floor(m/60);
  return h ? `${h} ч ${m%60} мин` : `${m} мин`;
}
let dailyTimer = 0;
function drawDaily(justGot){
  const box = document.getElementById("daily"); if(!box) return;
  if(DAILY_BASE<=0){ box.hidden = true; return; }
  box.hidden = false;
  const st = dailyState();
  const done = st.ready ? st.streak : st.day; // сколько клеток закрашено
  box.className = "daily" + (st.ready ? " ready" : "");
  box.innerHTML = `
    <svg class="daily-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M12 9c-2-4-7-4-7-1s4 1 7 1zm0 0c2-4 7-4 7-1s-4 1-7 1z"/></svg>
    <div class="daily-t"><b>Ежедневный подарок</b>
      <span>${st.ready ? `День ${st.day} из 7 — заходите каждый день, награда растёт` : justGot ? `Получено ${money(Math.round(DAILY_BASE*DAILY_MULT[(st.day-1)%7]))}! Следующий — через ${untilTomorrow()}` : `Следующий подарок через ${untilTomorrow()}`}</span></div>
    <ol class="daily-days" aria-label="Серия дней">${DAILY_MULT.map((m,i)=>`<li class="${i<done?'got':''}${st.ready && i===st.day-1?' now':''}"><small>Д${i+1}</small><span class="fl">${money(DAILY_BASE*m).replace(/\s₽$/,"")}</span><span class="sh">${shortNum(DAILY_BASE*m)}</span></li>`).join("")}</ol>
    ${st.ready ? `<button class="btn primary daily-go" id="daily-go">Забрать ${money(st.prize)}</button>` : ``}`;
  const b = document.getElementById("daily-go"); if(b) b.addEventListener("click", claimDaily);
  clearInterval(dailyTimer);
  dailyTimer = setInterval(()=>{ if(!document.getElementById("daily")){ clearInterval(dailyTimer); return; } const r = dailyState().ready; if(r !== st.ready || !r) drawDaily(); }, 30000);
}

/* ---------- Батлы кейсов ----------
 * Игроки открывают одинаковый набор кейсов. У кого сумма дропа больше — забирает все предметы.
 * Сервер выдаёт случайное зерно, когда батл заполнен; из него каждый браузер одинаково считает все дропы.
 * В батлах всегда обычные шансы кейсов (без персональной удачи). */
const BT = {list:[], unsub:null, create:{cases:[], size:2}, anim:null, seen:new Set(), skip:false, wake:null, view:null};
const btOn = () => !LOCAL_ONLY && !!CL.id && !!CL.db && typeof CL.db.action==="function";
function rollWith(c, r){
  let x = r(), acc = 0, k = 0;
  for(; k<5; k++){ acc += RAR[k].p; if(x<acc) break; }
  if(k>4) k = 0;
  const list = c.skins.filter(sk=>sk.rar===k), sk = list[Math.floor(r()*list.length)];
  x = r(); acc = 0; let w = 2;
  for(let i=0;i<WEAR.length;i++){ acc += WEAR[i].p; if(x<acc){ w = i; break; } }
  const fl = WEAR[w].min + r()*(WEAR[w].max-WEAR[w].min), st = r() < ST_P;
  return {c:c.id, s:sk.i, w, fl:+fl.toFixed(4), st, price:Math.max(2, Math.round(sk.basePrice*WEAR[w].m*(st?ST_M:1)))};
}
function btResults(d){ return d.players.map((p,slot)=>d.cases.map((cid,round)=>{ const c = CASE_BY_ID[cid]; return c ? rollWith(c, rng(hash(d.seed+"|"+slot+"|"+round))) : null; })); }
const btTotals = res => res.map(row=>row.reduce((a,it)=>a+(it?it.price:0),0));
function btWinner(d, res){ const t = btTotals(res); let w = 0; t.forEach((v,i)=>{ if(v>t[w] || (v===t[w] && hash(d.seed+"#"+i) > hash(d.seed+"#"+w))) w = i; }); return w; }
const btCostOf = ids => Math.round(ids.reduce((a,id)=>a+(CASE_BY_ID[id] ? CASE_BY_ID[id].price : 0), 0));
function btMine(){ if(!S.bt || typeof S.bt!=="object" || Array.isArray(S.bt)) S.bt = {}; return S.bt; }
function btStats(){ S.stats.battle = Object.assign({n:0, win:0, spent:0, got:0}, S.stats.battle||{}); return S.stats.battle; }
function btParse(id, x){
  if(!x || !Array.isArray(x.players) || !Array.isArray(x.cases)) return null;
  return {id:String(x.id||id), by:String(x.by||""), cases:x.cases.slice(0,8).map(String), size:[2,3,4].includes(x.size) ? x.size : 2, cost:Math.max(0, Number(x.cost)||0),
    players:x.players.slice(0,4).map(q=>({pid:String(q.pid||""), nick:String(q.nick||"Игрок").slice(0,20), bot:!!q.bot, av:{g:(q.av&&q.av.g)|0, c:(q.av&&q.av.c)|0}})),
    state:["open","done","cancel"].includes(x.state) ? x.state : "cancel", ts:Number(x.ts)||0, seed:String(x.seed||""), started:Number(x.started)||0};
}
/* расчёт с игроком: выигрыш, возврат за отменённый батл или если место перехватили */
function btSettle(d){
  const m = btMine()[d.id]; if(!m || m.done || BT.anim===d.id) return false;
  const inIt = d.players.some(q=>q.pid===CL.id), st = btStats();
  if(d.state==="cancel" || (d.state==="done" && !inIt) || (d.state==="open" && !inIt && Date.now()-m.t > 20000)){
    S.bal = Math.round((S.bal + m.paid)*100)/100; st.spent = Math.max(0, st.spent - m.paid); st.n = Math.max(0, st.n - 1); vaultAdd(-m.paid);
    m.done = true; m.refund = true; return true;
  }
  if(d.state!=="done") return false;
  const res = btResults(d), w = btWinner(d, res);
  m.done = true;
  if(d.players[w].pid===CL.id){
    const now = Date.now(); let sum = 0;
    res.flat().filter(Boolean).forEach((it,i)=>{ const o = Object.assign({}, it, {id:now.toString(36)+i.toString(36)+Math.random().toString(36).slice(2,6), t:now}); S.inv.unshift(o); sum += o.price; if(!S.stats.best || o.price > S.stats.best.price) S.stats.best = o; });
    st.win++; st.got = Math.round(st.got + sum); m.won = sum; vaultAdd(0, 20);
  }
  return true;
}
function btSettleAll(list){
  const mine = btMine(), byId = Object.fromEntries(list.map(d=>[d.id,d])); let ch = false;
  Object.keys(mine).forEach(id=>{ const d = byId[id]; if(d) ch = btSettle(d) || ch; else if(!mine[id].done && Date.now()-mine[id].t > 49*3600e3){ mine[id].done = true; ch = true; } });
  Object.keys(mine).forEach(id=>{ if(mine[id].done && Date.now()-mine[id].t > 72*3600e3){ delete mine[id]; ch = true; } });
  if(ch){ save(); renderHeader(); }
}
function btInitSettle(){
  if(!btOn() || !Object.values(btMine()).some(m=>!m.done)) return;
  CL.db.collection("battles").get().then(snap=>btSettleAll(snap.docs.map(x=>btParse(x.id, x.data())).filter(Boolean))).catch(()=>{});
}
function btSubscribe(){
  if(BT.unsub || !btOn()) return;
  BT.unsub = CL.db.collection("battles").onSnapshot(snap=>{
    BT.list = snap.docs.map(x=>btParse(x.id, x.data())).filter(Boolean);
    btSettleAll(BT.list);
    if(document.getElementById("bt-lists")) drawBattleLists();
    else if(!document.getElementById("bv") && BT.unsub){ BT.unsub(); BT.unsub = null; }
  }, ()=>{});
}
async function btAct(body){
  const r = await CL.db.action("battle", Object.assign({nick:S.profile.nick, av:{g:S.profile.av.g|0, c:S.profile.av.c|0}}, body)) || {};
  if(r.battle){ const d = btParse(r.battle.id, r.battle); if(d){ const i = BT.list.findIndex(x=>x.id===d.id); if(i>=0) BT.list[i] = d; else BT.list.unshift(d); r.battle = d; } }
  return r;
}
function btPay(id, cost){ vaultAdd(cost); S.bal = Math.round((S.bal-cost)*100)/100; btMine()[id] = {paid:cost, t:Date.now()}; const st = btStats(); st.n++; st.spent = Math.round(st.spent + cost); save(); renderHeader(); }
function btUnpay(id){ const m = btMine()[id]; if(!m) return; vaultAdd(-m.paid); S.bal = Math.round((S.bal+m.paid)*100)/100; const st = btStats(); st.n = Math.max(0, st.n-1); st.spent = Math.max(0, st.spent - m.paid); delete btMine()[id]; save(); renderHeader(); }
async function btCreate(){
  const msg = document.getElementById("bt-msg"), ids = BT.create.cases.slice(), cost = btCostOf(ids), b = document.getElementById("bt-create");
  if(!ids.length){ flash(msg, false, "Добавьте хотя бы один кейс"); return; }
  if(cost > S.bal){ flash(msg, false, "Не хватает денег на балансе"); return; }
  b.disabled = true;
  const tmp = "new"+Date.now(); btPay(tmp, cost);
  let r; try{ r = await btAct({action:"create", cases:ids, size:BT.create.size, cost}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error || !r.battle){ btUnpay(tmp); b.disabled = false; flash(msg, false, r.error || "Не получилось"); return; }
  const m = btMine(); m[r.battle.id] = m[tmp]; delete m[tmp]; save();
  BT.create.cases = [];
  location.hash = "#battle-" + r.battle.id;
}
async function btJoin(d, msg){
  if(d.cost > S.bal){ flash(msg, false, "Не хватает денег на балансе"); return; }
  btPay(d.id, d.cost);
  let r; try{ r = await btAct({action:"join", id:d.id}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error){ btUnpay(d.id); flash(msg, false, r.error); if(document.getElementById("bt-lists")) drawBattleLists(); return; }
  if(location.hash === "#battle-"+d.id) bvUpdate(r.battle); else location.hash = "#battle-" + d.id;
}
async function btSimple(d, action, msg){
  let r; try{ r = await btAct({action, id:d.id}); }catch(e){ r = {error:"Нет связи с сервером"}; }
  if(r.error){ flash(msg, false, r.error); return; }
  if(r.battle) btSettleAll([r.battle]);
  if(document.getElementById("bv")) bvUpdate(r.battle); else drawBattleLists();
}
const btAva = q => q.bot ? `<span class="bt-bot" aria-hidden="true">🤖</span>` : avatarOf(q, 26);

function viewBattles(){
  const app = document.getElementById("app");
  if(!btOn()){
    app.innerHTML = `<div class="view-head"><h1>Батлы</h1></div><div class="empty">${LOCAL_ONLY ? "Батлы работают только в версии сайта с сервером." : "Войдите в аккаунт, чтобы играть в батлы с другими игроками."}</div>`;

      <div class="run-stats">
        <div class="stat"><small>Батлов</small><b class="num">${st.n}</b></div>
        <div class="stat"><small>Побед</small><b class="num">${st.win}</b></div>

    <section class="panel bt-create">

        <div class="bt-size" role="group" aria-label="Игроков">${[2,3,4].map(n=>`<button type="button" class="btn${BT.create.size===n?' on':''}" data-size="${n}">${n} игрока</button>`).join("")}</div></div>
      <div class="bt-picked" id="bt-picked"></div>
      <details class="bt-pickbox" ${BT.create.cases.length?'':'open'}><summary>Выбрать кейсы (до 8 раундов)</summary><div class="bt-pick" id="bt-pick"></div></details>
      <div class="bt-go-row"><button class="btn primary" id="bt-create"></button><span class="hint" id="bt-msg"></span></div>

  app.querySelectorAll("[data-size]").forEach(b=>b.addEventListener("click",()=>{ BT.create.size = +b.dataset.size; app.querySelectorAll("[data-size]").forEach(x=>x.classList.toggle("on", x===b)); }));

  pick.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{ if(BT.create.cases.length>=8) return; BT.create.cases.push(b.dataset.add); drawBtCreate(); }));
  document.getElementById("bt-create").addEventListener("click", btCreate);

function drawBtCreate(){
  const box = document.getElementById("bt-picked"); if(!box) return;

function btCard(d){
  const me = d.players.some(q=>q.pid===CL.id), mineOwn = d.by===CL.id;
  const slots = Array.from({length:d.size}, (_,i)=>{ const q = d.players[i]; return q ? `<span class="bt-p${q.pid===CL.id?' me':''}">${btAva(q)}<b></b></span>` : `<span class="bt-p free"><i>?</i><b>Свободно</b></span>`; }).join(`<span class="bt-vs">vs</span>`);
  let act = "";
  if(d.state==="open") act = me ? `<a class="btn" href="#battle-${d.id}">Открыть</a>` : `<button class="btn primary" data-join="${d.id}">Войти · ${money(d.cost)}</button>`;
  else act = `<a class="btn" href="#battle-${d.id}">Смотреть</a>`;
  let res = "";
  if(d.state==="done"){ const r = btResults(d), w = btWinner(d, r); res = `<span class="bt-res">Победил <b></b> · ${money(btTotals(r).reduce((a,b)=>a+b,0))}</span>`; d._w = d.players[w].nick; }
  return `<div class="bt-card${me?' mine':''}" data-id="${d.id}">

function drawBattleLists(){

/* --- экран одного батла --- */
function viewBattle(id){
  const app = document.getElementById("app");
  if(!btOn()){ location.replace("#battles"); return; }
  app.innerHTML = `
    <div class="view-head"><div><h1>Батл</h1><p class="sub" id="bv-sub">Загрузка…</p></div><a class="btn" href="#battles">← Все батлы</a></div>
    <div id="bv"></div>`;
  BT.view = {id, d:null, mode:""};
  const d0 = BT.list.find(x=>x.id===id); if(d0) bvUpdate(d0);
  let un = null, stop = false;
  un = CL.db.doc("battles/"+id).onSnapshot(snap=>{
    if(stop) return;
    if(!document.getElementById("bv") || !BT.view || BT.view.id!==id){ stop = true; if(un) un(); return; }
    if(!snap.exists){ document.getElementById("bv-sub").textContent = "Батл не найден: возможно, он уже удалён."; return; }
    const d = btParse(id, snap.data()); if(d) bvUpdate(d);
  }, ()=>{});
  if(stop && un) un();
  btSubscribe();
}
function bvUpdate(d){
  if(!d || !BT.view || BT.view.id!==d.id || !document.getElementById("bv")) return;
  const i = BT.list.findIndex(x=>x.id===d.id); if(i>=0) BT.list[i] = d; else BT.list.push(d);
  BT.view.d = d;
  if(d.state==="done"){
    if(BT.anim===d.id || BT.view.mode==="final") return;
    if(!BT.seen.has(d.id) && motionOK() && Date.now()-d.started < 15*60e3) bvAnimate(d);
    else bvFinal(d);
    return;
  }
  bvWaiting(d);
}
function bvShell(d){
  const sub = document.getElementById("bv-sub");
  sub.textContent = `${d.size} ${plural(d.size,"игрок","игрока","игроков")} · ${d.cases.length} ${plural(d.cases.length,"раунд","раунда","раундов")} · вход ${money(d.cost)}`;
  const bv = document.getElementById("bv");
  bv.innerHTML = `
    <div class="bv-rounds">${d.cases.map((id,i)=>{ const c = CASE_BY_ID[id]; return c ? `<span class="bv-rd" data-r="${i}" title="${c.name}">${caseArt(c)}<small>${i+1}</small></span>` : ""; }).join("")}</div>
    <div class="bv-cols n${d.size}">${Array.from({length:d.size},(_,i)=>{ const q = d.players[i];
      return `<div class="bv-col${q && q.pid===CL.id?' me':''}" data-slot="${i}">
        <div class="bv-head">${q ? btAva(q) : '<span class="bt-bot">?</span>'}<b></b><span class="num bv-sum"></span></div>
        <div class="bv-reel"><div class="bv-strip"></div></div>
        <div class="bv-items"></div></div>`; }).join("")}</div>
    <div class="bv-foot" id="bv-foot"></div>`;
  bv.querySelectorAll(".bv-col").forEach((col,i)=>{ const q = d.players[i]; col.querySelector(".bv-head b").textContent = q ? q.nick : "Ожидание…"; });
}
const bvItem = it => { const sk = skinOf(it); return `<div class="bv-mi" style="--rc:${RAR[sk.rar].color}"><span class="num">${money(it.price)}</span>${art(sk)}<small></small></div>`; };
function bvFillNames(box, list){ box.querySelectorAll(".bv-mi small").forEach((el,i)=>{ const it = list[i]; if(it){ const sk = skinOf(it); el.textContent = (it.st?"ST ":"") + sk.name; } }); }
function bvWaiting(d){
  BT.view.mode = "wait";
  bvShell(d);
  const bv = document.getElementById("bv");
  bv.querySelectorAll(".bv-col").forEach((col,i)=>{ if(!d.players[i]) col.classList.add("wait"); col.querySelector(".bv-reel").innerHTML = d.players[i] ? `<span class="bv-ready">Готов</span>` : `<span class="bv-ready pulse">Ждём соперника</span>`; });
  const foot = document.getElementById("bv-foot"), me = d.players.some(q=>q.pid===CL.id);
  if(d.state==="cancel"){ foot.innerHTML = `<p class="hint">Батл отменён. Деньги за вход вернулись на баланс.</p>`; return; }
  foot.innerHTML = `${!me ? `<button class="btn primary" id="bv-join">Войти в батл · ${money(d.cost)}</button>` : ""}
    ${(d.by===CL.id || CL.owner) ? `<button class="btn" id="bv-bots">Позвать ботов</button><button class="btn" id="bv-cancel">Отменить батл</button>` : ""}
    <span class="hint" id="bv-msg">${me ? "Батл начнётся, как только наберутся игроки. Друзья увидят его во вкладке «Батлы»." : ""}</span>`;
  const msg = document.getElementById("bv-msg");
  const j = document.getElementById("bv-join"); if(j) j.addEventListener("click", ()=>{ j.disabled = true; btJoin(d, msg); });
  const bb = document.getElementById("bv-bots"); if(bb) bb.addEventListener("click", ()=>{ bb.disabled = true; btSimple(d, "bots", msg); });
  const cb = document.getElementById("bv-cancel"); if(cb) cb.addEventListener("click", ()=>{ cb.disabled = true; btSimple(d, "cancel", msg); });
}
const bvSleep = ms => new Promise(res=>{ if(BT.skip) return res(); const t = setTimeout(res, ms); BT.wake = ()=>{ clearTimeout(t); res(); }; });
async function bvAnimate(d){
  BT.anim = d.id; BT.skip = false; BT.view.mode = "anim";
  bvShell(d);
  const res = btResults(d), sums = d.players.map(()=>0), won = d.players.map(()=>[]);
  const here = () => document.getElementById("bv") && BT.view && BT.view.id===d.id;
  const foot = document.getElementById("bv-foot");
  foot.innerHTML = `<button class="btn" id="bv-skip">Пропустить анимацию</button>`;
  document.getElementById("bv-skip").addEventListener("click", ()=>{ BT.skip = true; if(BT.wake) BT.wake(); });
  const cols = [...document.querySelectorAll(".bv-col")], H = 92;
  for(let r=0; r<d.cases.length && here() && !BT.skip; r++){
    document.querySelectorAll(".bv-rd").forEach(x=>x.classList.toggle("on", +x.dataset.r===r));
    document.querySelectorAll(".bv-rd").forEach(x=>x.classList.toggle("past", +x.dataset.r<r));
    const c = CASE_BY_ID[d.cases[r]];
    cols.forEach((col,slot)=>{
      const strip = col.querySelector(".bv-strip"), win = res[slot][r];
      const items = Array.from({length:24}, (_,k)=> k===20 && win ? win : (c ? {c:c.id, s:pickSkin(c).i, w:2} : null)).filter(Boolean);
      strip.style.transition = "none"; strip.style.transform = "translateY(0)";
      strip.innerHTML = items.map(it=>{ const sk = skinOf(it); return `<div class="bv-it" style="--rc:${RAR[sk.rar].color}">${art(sk)}</div>`; }).join("");
    });
    void document.body.offsetHeight;
    cols.forEach(col=>{ const strip = col.querySelector(".bv-strip"), reel = col.querySelector(".bv-reel"); const off = 20*H - (reel.clientHeight - H)/2;
      strip.style.transition = `transform 2.4s cubic-bezier(.12,.8,.18,1)`; strip.style.transform = `translateY(${-off}px)`; });
    if(S.sound) beep(520,.05,.03,"triangle");
    await bvSleep(2600);
    if(BT.skip || !here()) break;
    cols.forEach((col,slot)=>{ const it = res[slot][r]; if(!it) return; sums[slot] += it.price; won[slot].push(it);
      const box = col.querySelector(".bv-items"); box.insertAdjacentHTML("afterbegin", bvItem(it)); bvFillNames(box, won[slot].slice().reverse());
      col.querySelector(".bv-sum").textContent = money(sums[slot]); });
    const lead = sums.indexOf(Math.max(...sums));
    cols.forEach((col,i)=>col.classList.toggle("lead", i===lead));
    if(S.sound) beep(880,.06,.04,"triangle");
    await bvSleep(500);
  }
  BT.anim = null; BT.seen.add(d.id);
  if(here()) bvFinal(d);
  btSettleAll([d]);
}
function bvFinal(d){
  BT.view.mode = "final"; BT.seen.add(d.id);
  btSettleAll([d]);
  bvShell(d);
  const res = btResults(d), tot = btTotals(res), w = btWinner(d, res), all = tot.reduce((a,b)=>a+b,0);
  document.querySelectorAll(".bv-rd").forEach(x=>x.classList.add("past"));
  document.querySelectorAll(".bv-col").forEach((col,i)=>{
    col.classList.toggle("win", i===w); col.classList.toggle("lose", i!==w);
    col.querySelector(".bv-sum").textContent = money(tot[i]);
    col.querySelector(".bv-reel").innerHTML = i===w ? `<span class="bv-ready win">Победа · ${money(all)}</span>` : `<span class="bv-ready">${money(tot[i])}</span>`;
    const box = col.querySelector(".bv-items"), list = res[i].filter(Boolean);
    box.innerHTML = list.map(bvItem).join(""); bvFillNames(box, list);
  });
  const m = btMine()[d.id], meWin = d.players[w].pid===CL.id, me = d.players.some(q=>q.pid===CL.id);
  document.getElementById("bv-foot").innerHTML = `
    <span class="bv-verdict ${meWin?'good':me?'bad':''}">${meWin ? `Вы победили! Все предметы (${money(all)}) уже в вашем инвентаре.` : me ? `Победил ${esc(d.players[w].nick)}. В этот раз не повезло.` : `Победил ${esc(d.players[w].nick)} и забрал ${money(all)}.`}</span>
    <button class="btn primary" id="bv-again">Создать такой же батл</button>`;
  document.getElementById("bv-again").addEventListener("click", ()=>{ BT.create = {cases:d.cases.filter(id=>CASE_BY_ID[id] && !CASE_BY_ID[id].off), size:d.size}; location.hash = "#battles"; });
  void m;
}

/* ---------- Секретное хранилище ----------
 * Долгая цель: за игру начисляются фрагменты кода (1 фрагмент за VAULT_RATE ₽ оборота во всех режимах,
 * плюс бонусы за ежедневный подарок и победы в батлах). Каждые 6 замков — новое хранилище, пороги и награды ×2. */
const VAULT_STEPS = [50, 200, 600, 1500, 4000, 10000];
const VAULT_CASH  = [1000, 3000, 8000, 20000, 50000];
const VAULT_FINAL = ["gold","diamond","empire","plasma","abyss","legend","million"];
function vaultState(){
  const v = S.vault && typeof S.vault==="object" ? S.vault : (S.vault = {f:0, season:1, claimed:0});
  v.f = Math.max(0, Number(v.f)||0); v.season = Math.max(1, v.season|0); v.claimed = Math.min(6, Math.max(0, v.claimed|0));
  return v;
}
const vaultK = season => Math.pow(2, season-1);
const vaultNeed = (season, i) => VAULT_STEPS[i]*vaultK(season);
const vaultFinalCase = season => CASE_BY_ID[VAULT_FINAL[Math.min(VAULT_FINAL.length-1, season-1)]] || CASES[CASES.length-1];
const vaultLocks = () => { const v = vaultState(); return (v.season-1)*6 + v.claimed; };
function vaultReady(){ const v = vaultState(); return v.claimed < 6 && v.f >= vaultNeed(v.season, v.claimed); }
function vaultAdd(rub, bonus){
  const v = vaultState();
  v.f = Math.max(0, Math.round((v.f + (rub||0)/VAULT_RATE + (bonus||0))*100)/100);
  vaultBadge();
}
function vaultItem(c){
  const list = c.skins.filter(x=>x.rar===4), sk = list[Math.floor(Math.random()*list.length)];
  let x = Math.random(), acc = 0, w = 2; for(let i=0;i<WEAR.length;i++){ acc += WEAR[i].p; if(x<acc){ w = i; break; } }
  const fl = WEAR[w].min + Math.random()*(WEAR[w].max-WEAR[w].min), st = Math.random() < ST_P;
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), c:c.id, s:sk.i, w, fl:+fl.toFixed(4), st, price:Math.max(2, Math.round(sk.basePrice*WEAR[w].m*(st?ST_M:1))), t:Date.now()};
}
function vaultClaim(){
  const v = vaultState(); if(!vaultReady()) return;
  const i = v.claimed;
  if(i < 5){ const a = VAULT_CASH[i]*vaultK(v.season); S.bal = Math.round((S.bal + a)*100)/100; v.last = {type:"cash", amount:a}; }
  else { const it = vaultItem(vaultFinalCase(v.season)); S.inv.unshift(it); if(!S.stats.best || it.price > S.stats.best.price) S.stats.best = it; v.last = {type:"item", item:it}; }
  v.claimed++;
  if(S.sound){ [523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.12,.05,"triangle"), k*110)); }
  save(); renderHeader(); viewVault(true);
}
function vaultNext(){
  const v = vaultState(); if(v.claimed < 6) return;
  v.season++; v.claimed = 0; v.f = 0; v.last = null; save(); viewVault();
}
function vaultBadge(){
  const b = document.getElementById("nav-vault-dot"); if(b) b.hidden = !vaultReady(); navMoreState();
  const box = document.getElementById("vault-bar"); if(box) drawVaultBar();
}
const fr = n => Math.floor(n).toLocaleString("ru-RU");
function drawVaultBar(){
  const box = document.getElementById("vault-bar"); if(!box) return;
  const v = vaultState(), i = Math.min(5, v.claimed), need = vaultNeed(v.season, i), prev = i ? vaultNeed(v.season, i-1) : 0;
  const pctv = v.claimed>=6 ? 100 : Math.min(100, Math.max(0, (v.f-prev)/(need-prev)*100));
  const ready = vaultReady() || v.claimed>=6;
  box.className = "vault-bar" + (ready ? " ready" : "");
  box.innerHTML = `${VAULT_ICON}
    <span class="vb-t"><b>Секретное хранилище ${v.season>1 ? toRoman(v.season) : ""}</b><small>${v.claimed>=6 ? "Хранилище вскрыто! Откройте следующее" : ready ? `Замок ${i+1} готов к взлому — заберите награду` : `Замок ${i+1} из 6 · ${fr(v.f)} / ${fr(need)} фрагментов`}</small></span>
    <span class="vb-locks">${Array.from({length:6},(_,k)=>`<i class="${k<v.claimed?'open':k===v.claimed&&ready?'ready':''}"></i>`).join("")}</span>
    <span class="vb-prog"><i style="width:${pctv.toFixed(1)}%"></i></span>
    <span class="btn ${ready?'primary':''}">${ready ? "Взломать" : "Открыть"}</span>`;
}
const toRoman = n => { const m = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let r = ""; for(const [v,c] of m) while(n>=v){ r+=c; n-=v; } return r; };
const VAULT_ICON = `<svg class="vb-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4.5"/><path d="M12 7.5v2M12 14.5v2M7.5 12h2M14.5 12h2M6 21v1.5M18 21v1.5"/></svg>`;
function viewVault(justClaimed){
  const app = document.getElementById("app"), v = vaultState(), K = vaultK(v.season), fc = vaultFinalCase(v.season);
  const i = Math.min(5, v.claimed), need = vaultNeed(v.season, i), ready = vaultReady();
  const angle = v.claimed*60;
  const last = justClaimed && v.last;
  app.innerHTML = `
    <div class="view-head"><div><h1>Секретное хранилище ${v.season>1 ? toRoman(v.season) : ""}</h1>
      <p class="sub">Играйте в любые режимы — копите фрагменты кода и взламывайте замки. За каждым замком награда, а внутри хранилища — то, о чём никто не знает.</p></div>
      <div class="run-stats"><div class="stat"><small>Фрагменты</small><b class="num">${fr(v.f)}</b></div><div class="stat"><small>Вскрыто замков</small><b class="num">${vaultLocks()}</b></div></div>
    </div>
    <div class="vault-wrap">
      <section class="panel vault-door-p">
        <svg class="vault-door${v.claimed>=6?' open':''}" viewBox="0 0 300 300" aria-label="Дверь хранилища, вскрыто замков: ${v.claimed} из 6">
          <defs><radialGradient id="vdg" cx=".45" cy=".4"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1a1a1a"/></radialGradient></defs>
          <rect x="18" y="18" width="264" height="264" rx="22" fill="#151515" stroke="#2c2c2c" stroke-width="3"/>
          <circle cx="150" cy="150" r="118" fill="url(#vdg)" stroke="#3a3a3a" stroke-width="6"/>
          ${Array.from({length:6},(_,k)=>{ const a=(k*60-90)*Math.PI/180, x=150+96*Math.cos(a), y=150+96*Math.sin(a); const st = k<v.claimed ? "open" : (k===v.claimed && ready) ? "ready" : "";
            return `<g class="vlock ${st}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" text-anchor="middle">${k<v.claimed ? "✓" : k+1}</text></g>`; }).join("")}
          <g class="vwheel" style="transform:rotate(${angle}deg)">
            <circle cx="150" cy="150" r="52" fill="#202020" stroke="var(--accent)" stroke-width="3"/>
            ${[0,60,120].map(a=>`<rect x="146" y="92" width="8" height="116" rx="4" fill="#3a3a3a" transform="rotate(${a} 150 150)"/>`).join("")}
            <circle cx="150" cy="150" r="16" fill="var(--accent)"/>
          </g>
        </svg>
        ${last ? `<p class="vault-got">${last.type==="cash" ? `Замок вскрыт! +${money(last.amount)}` : `Хранилище вскрыто! Внутри — ★ ${esc(skinOf(last.item).name)} за ${money(last.item.price)}. Он уже в инвентаре.`}</p>` : ""}
        ${v.claimed>=6 ? `<button class="btn primary vault-go" id="vault-next">Найти следующее хранилище</button>`
          : `<div class="vault-prog"><div class="vb-prog big"><i style="width:${Math.min(100, v.f/need*100).toFixed(1)}%"></i></div><span>${fr(v.f)} / ${fr(need)} фрагментов до замка ${i+1}</span></div>
             <button class="btn primary vault-go" id="vault-claim" ${ready?'':'disabled'}>${ready ? (i<5 ? `Взломать замок ${i+1} · +${money(VAULT_CASH[i]*K)}` : "Вскрыть хранилище") : `Нужно ещё ${fr(Math.ceil(need - v.f))} ${plural(Math.ceil(need - v.f),"фрагмент","фрагмента","фрагментов")}`}</button>`}
      </section>
      <section class="panel">
        <div class="ph"><h2>Замки и награды</h2></div>
        <ol class="vault-list">${VAULT_STEPS.map((st,k)=>{ const done = k<v.claimed, now = k===v.claimed;
          const prize = k<5 ? money(VAULT_CASH[k]*K) : (v.claimed>=5 ? `★ Редкий предмет из кейса «${fc.name}»` : "??? Секрет");
          return `<li class="${done?'done':now?'now':''}"><b>Замок ${k+1}</b><span>${fr(st*K)} фрагм.</span><em>${prize}</em></li>`; }).join("")}</ol>
        <div class="ph" style="margin-top:6px"><h2>Как получать фрагменты</h2></div>
        <ul class="vault-how">
          <li>Открытие кейсов, апгрейды, краш и батлы — <b>1 фрагмент за каждые ${money(VAULT_RATE)}</b> ставок</li>
          <li>Ежедневный подарок — <b>+25</b></li>
          <li>Победа в батле — <b>+20</b></li>
        </ul>
        <p class="hint">После шестого замка открывается следующее хранилище: замки вдвое прочнее, награды вдвое больше.</p>
      </section>
    </div>`;
  const c = document.getElementById("vault-claim"); if(c) c.addEventListener("click", vaultClaim);
  const n = document.getElementById("vault-next"); if(n) n.addEventListener("click", vaultNext);
}


/* ---------- Меню «Ещё» на телефоне ---------- */
function drawMore(){
  const sh = document.getElementById("more-sheet"); if(!sh) return;
  const links = [...document.querySelectorAll("nav a.nav-x")].filter(a=>!a.hidden);
  sh.innerHTML = links.map(a=>`<a href="${a.getAttribute("href")}" class="${a.classList.contains("on")?'on':''}">${a.querySelector("svg").outerHTML}<span>${a.querySelector(".nl").textContent}</span>${a.querySelector(".nav-dot") && !a.querySelector(".nav-dot").hidden ? '<i class="nav-dot"></i>' : ''}</a>`).join("");
}
function moreToggle(open){
  const sh = document.getElementById("more-sheet"), b = document.getElementById("nav-more"); if(!sh || !b) return;
  if(open===undefined) open = sh.hidden;
  if(open) drawMore();
  sh.hidden = !open; b.setAttribute("aria-expanded", String(open));
}
document.getElementById("nav-more").addEventListener("click", e=>{ e.stopPropagation(); moreToggle(); });
document.addEventListener("click", e=>{ const sh = document.getElementById("more-sheet"); if(sh && !sh.hidden && !sh.contains(e.target)) moreToggle(false); });
function navMoreState(){
  const b = document.getElementById("nav-more"); if(!b) return;
  b.classList.toggle("on", [...document.querySelectorAll("nav a.nav-x")].some(a=>a.classList.contains("on")));
  const vd = document.getElementById("nav-vault-dot"), md = document.getElementById("nav-more-dot");
  if(md && vd) md.hidden = vd.hidden;
}
/* ---------- Маршрутизация ---------- */
function route(){
  const h = location.hash.slice(1);
  document.getElementById("nav-cases").classList.toggle("on", h==="" || h==="cases" || h.startsWith("case-"));
  document.getElementById("nav-inv").classList.toggle("on", h==="inventory" || h==="profile");
  document.getElementById("nav-upg").classList.toggle("on", h==="upgrade");
  document.getElementById("nav-run").classList.toggle("on", h==="runner");
  document.getElementById("nav-crash").classList.toggle("on", h==="crash");
  document.getElementById("nav-bt").classList.toggle("on", h==="battles" || h.startsWith("battle-"));
  document.getElementById("nav-top").classList.toggle("on", h==="top");
  document.getElementById("nav-admin").classList.toggle("on", h==="admin");
  document.getElementById("nav-vault").classList.toggle("on", h==="vault");
  moreToggle(false); navMoreState();
  if(h==="admin") return viewAdmin();
  if(h==="profile") return viewProfile();
  if(h==="top" && LOCAL_ONLY){ location.replace("#cases"); return; }
  if(h==="top") return viewTop();
  if(h==="runner"){ if(document.getElementById("rc")) return; return viewRunner(); }
  if(h==="crash"){ if(document.getElementById("crc")) return; return viewCrash(); }
  if(h==="battles") return viewBattles();
  if(h==="vault") return viewVault();
  if(h.startsWith("battle-")){ if(BT.view && BT.view.id===h.slice(7) && document.getElementById("bv")) return; return viewBattle(h.slice(7)); }
  if(h==="upgrade"){ if(upSpinning && document.getElementById("needle")) return; return viewUpgrade(); }
  if(h==="inventory") return viewInventory();
  if(h.startsWith("case-") && CASE_BY_ID[h.slice(5)]){
    if(spinning && document.getElementById("rolls")) return;
    return viewCase(CASE_BY_ID[h.slice(5)]);
  }
  viewCases();
}
let lastHash = location.hash;
window.addEventListener("hashchange",()=>{ if(location.hash!==lastHash){ lastHash=location.hash; window.scrollTo(0,0); } route(); });

/* ---------- Кнопки шапки ---------- */
document.getElementById("sound").addEventListener("click",()=>{ S.sound=!S.sound; save(); renderHeader(); if(MUS.on || document.getElementById("rc")){ musicStop(); if(S.sound && G && G.state==="run") musicStart(); } });

const editable = t => t && t.closest && t.closest("input,textarea");
["copy","cut"].forEach(ev=>document.addEventListener(ev, e=>{ if(!editable(e.target)) e.preventDefault(); }));
document.addEventListener("contextmenu", e=>{ if(!editable(e.target)) e.preventDefault(); });
document.addEventListener("dragstart", e=>{ if(!editable(e.target)) e.preventDefault(); });
document.addEventListener("selectstart", e=>{ if(!editable(e.target)) e.preventDefault(); });
if(LOCAL_ONLY){ const nt = document.getElementById("nav-top"); if(nt) nt.hidden = true; }
renderHeader();
route();
if(!LOCAL_ONLY) initCloud();
})();
