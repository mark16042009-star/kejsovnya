<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ПиксельДроп — пиксельный симулятор кейсов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo&display=swap" rel="stylesheet">
<style>
:root{
  /* Тёмный «игровой» мир, одна тема. Слева направо: шапка → лента дропов → сетка кейсов / рулетка / инвентарь */
  --bg:#141414; --bg2:#0f0f0f; --panel:#1c1c1c; --panel2:#242424; --line:#2c2c2c;
  --text:#f2f2f2; --muted:#8e8e8e; --accent:#ffc800; --accent2:#ff7a1a; --accent-ink:#1a1400;
  --good:#3ecf6e; --bad:#ef5350;
  --r0:#4b69ff; --r1:#8847ff; --r2:#d32ce6; --r3:#eb4b4b; --r4:#e4ae39;
  --display:"Tiny5 Duo", "Courier New", monospace;
  --body:"Tiny5 Duo", "Courier New", monospace;
  --mono:"Tiny5 Duo", "Courier New", monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--body);min-height:100%;font-synthesis:none;-webkit-font-smoothing:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}

/* Шапка */
header{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
nav a{white-space:nowrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo b{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.logo b span{color:var(--accent)}
.logo small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
nav{display:flex;gap:4px}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700}
nav a.on{color:var(--text);background:var(--panel2)}
nav a .cnt{font-family:var(--mono);font-size:12px;background:var(--line);padding:1px 6px;border-radius:6px;margin-left:4px}
.spacer{flex:1}
.wallet{display:flex;align-items:center;gap:8px}
.bal{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:10px;font-weight:700}
.bal .num{color:var(--good)}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:10px;font-weight:700}
.btn:hover{border-color:#3a3a3a}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center}

/* Лента дропов */
.feed{border-bottom:1px solid var(--line);background:var(--bg2)}
.feed-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.feed-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap;writing-mode:horizontal-tb;padding-right:6px}
.drop{flex:0 0 108px;height:64px;border-radius:8px;background:var(--panel);position:relative;overflow:hidden;border-bottom:3px solid var(--rc)}
.drop .art{position:absolute;inset:4px 6px 14px}
.drop span{position:absolute;left:6px;right:6px;bottom:2px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-empty{color:var(--muted);font-size:13px}

main{max-width:1240px;margin:0 auto;padding:24px 16px 48px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:30px}
.sub{color:var(--muted);margin:4px 0 0}

/* Сетка кейсов */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.case::before{content:"";position:absolute;inset:0;background:radial-gradient(240px 140px at 50% 30%, var(--ca) 0%, transparent 70%);opacity:.18;pointer-events:none}
.case:hover{transform:translateY(-3px);border-color:var(--ca)}
.case svg{width:100%;height:auto;position:relative}
.case-art{display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.case-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;position:relative}
.case h3{font-size:18px}
.price{font-family:var(--mono);font-weight:700;color:var(--accent)}
.case .top{font-size:12px;color:var(--muted);position:relative}
.case .top b{color:var(--r4);font-weight:700}

/* Страница кейса */
.back{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.back:hover{color:var(--text)}
.opener{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.rolls{display:grid;gap:8px}
.roll{position:relative;height:132px;overflow:hidden;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.roll::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--accent);box-shadow:0 0 12px var(--accent);z-index:2}
.roll::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--bg2) 0%,transparent 18%,transparent 82%,var(--bg2) 100%)}
.strip{display:flex;gap:10px;padding:10px 0;will-change:transform}
.cell{flex:0 0 120px;height:110px;background:var(--panel2);border-radius:8px;position:relative;border-bottom:3px solid var(--rc);overflow:hidden}
.cell::before{content:"";position:absolute;inset:0;background:radial-gradient(80px 50px at 50% 45%, var(--rc), transparent 75%);opacity:.22}
.cell .art{position:absolute;left:8px;right:8px;top:14px;height:52px}
.cell span{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span b{display:block;color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.case-preview{display:flex;align-items:center;justify-content:center;height:132px;border-radius:10px;background:var(--bg2);border:1px dashed var(--line)}
.case-preview svg{height:118px;width:auto}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.seg button.on{background:var(--panel2);color:var(--text)}
.seg button:disabled{cursor:not-allowed}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.open-btn{font-size:17px;padding:12px 22px}
.hint{font-size:13px;color:var(--muted)}
.hint.err{color:var(--bad)}

.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.section-title h2{font-size:20px}
.odds{display:flex;gap:6px;flex-wrap:wrap}
.odd{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.odd i{width:8px;height:8px;border-radius:2px;background:var(--rc)}
.contents{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--rc)}
.item::before{content:"";position:absolute;left:0;right:0;top:0;height:110px;background:radial-gradient(110px 60px at 50% 55%, var(--rc), transparent 75%);opacity:.18;pointer-events:none}
.item .art{width:100%;height:64px;position:relative}
.item .w{font-size:12px;color:var(--muted)}
.item .n{font-weight:700;line-height:1.25;font-size:14px}
.item .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.item .meta .price{font-size:13px}
.st{font-family:var(--mono);font-size:10px;font-weight:700;color:#cf6a32;border:1px solid #cf6a32;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
.mystery{display:grid;place-items:center;height:64px;font-family:var(--display);font-size:40px;color:var(--r4);position:relative}

/* Инвентарь */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--mono);font-size:20px}
.stat b.pos{color:var(--good)} .stat b.neg{color:var(--bad)}
.inv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:10px;font:inherit}
.item .sell{margin-top:4px;padding:6px 10px;font-size:13px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:36px;text-align:center;color:var(--muted)}

/* Модалка результата */
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;padding:22px;display:grid;gap:16px;max-height:calc(100% - 32px);overflow:auto}
.modal h2{font-size:24px}
.won{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.won .item{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.won .item.big .art{height:90px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* Апгрейд */
.upg{display:grid;grid-template-columns:minmax(0,1fr) 340px minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ph h2{font-size:18px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;max-height:560px;overflow:auto;padding:2px;align-content:start;grid-auto-rows:max-content}
.mini{background:var(--panel2);border:1px solid var(--line);border-bottom:3px solid var(--rc);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;inset:0;background:radial-gradient(70px 40px at 50% 30%, var(--rc), transparent 75%);opacity:.18;pointer-events:none}
.mini:hover{border-color:#3a3a3a;border-bottom-color:var(--rc)}
.mini.on{outline:2px solid var(--accent);outline-offset:-1px}
.mini .art{height:40px;width:100%;position:relative}
.mini small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .price{font-size:12px}
.mini:disabled{cursor:not-allowed;opacity:.6}
#up-q{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit;width:100%}
.mults{display:flex;gap:6px;flex-wrap:wrap}
.mults .btn{padding:6px 10px;font-family:var(--mono);font-size:13px}
.up-mid{justify-items:center;text-align:center}
.wheel{width:100%;max-width:260px;height:auto}
.wheel-pct{font-family:var(--mono);font-weight:700;font-size:30px;fill:var(--text)}
.wheel-lbl{font-size:12px;fill:var(--muted);font-family:var(--body)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;width:100%}
.vs .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:62px;display:grid;align-content:center;gap:2px}
.vs .box small{color:var(--muted);font-size:11px}
.vs .arrow{color:var(--accent);font-weight:800}
.up-target{width:100%}
.up-target .item{text-align:left}
.up-go{width:100%;font-size:17px;padding:12px}
.item.lost{filter:grayscale(.85);opacity:.6}
@media (max-width:1000px){.upg{grid-template-columns:1fr}.up-mid{order:-1}.minis{max-height:380px}}

/* Забег */
.runner{padding:10px}
#rc{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg2);touch-action:none;cursor:pointer}
.run-stats{display:flex;gap:10px;flex-wrap:wrap}
.run-stats .stat{padding:8px 12px}
.run-stats .stat b{font-size:16px}
kbd{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}

/* Профиль и рейтинг */
.me{display:flex;align-items:center;gap:8px;text-decoration:none;padding:4px 10px 4px 4px;border-radius:12px;border:1px solid transparent}
.me:hover{border-color:var(--line);background:var(--panel)}
.me .ava{border-radius:9px;flex:none}
.me-t{display:grid;line-height:1.15}
.me-t b{font-size:14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-t small{font-size:11px;color:var(--muted)}
.prof{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
.prof-card{grid-template-columns:minmax(0,1fr);display:grid;gap:14px;justify-items:center;text-align:center}
.prof-card .ava{border-radius:28px}
.prof-name{font-family:var(--display);font-size:24px;word-break:break-word}
.lvl{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.lvl b{color:var(--accent);font-family:var(--mono)}
.xpbar{width:100%;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;width:100%;text-align:left}
.field-row .btn{flex:none}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field-row{display:flex;gap:6px}
.field input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:2px solid transparent;background:none;padding:0;border-radius:12px;line-height:0}
.pick button.on{border-color:var(--text)}
.pick .sw{width:26px;height:26px;border-radius:8px;display:block}
.sync{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px;text-align:left;width:100%}
.sync.ok{border-color:var(--good)} .sync.warn{border-color:var(--accent)} .sync.err{border-color:var(--bad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text)}
.board{display:grid;gap:6px;margin-top:14px}
.row{display:grid;grid-template-columns:44px 40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:left;width:100%}
.row:hover{border-color:#3a3a3a}
.row.you{border-color:var(--accent)}
.row .place{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:16px}
.row.p1 .place{color:#e4ae39} .row.p2 .place{color:#c0c8d4} .row.p3 .place{color:#cd8a52}
.row .who{display:grid;line-height:1.25;min-width:0}
.row .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--muted);font-size:12px}
.row .val{font-family:var(--mono);font-weight:700;text-align:right}
.row .ava{border-radius:10px}
.you-tag{font-size:11px;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:0 5px;margin-left:6px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.prof{grid-template-columns:1fr}}
@media (max-width:640px){.me-t{display:none}.row{grid-template-columns:30px 34px minmax(0,1fr) auto;gap:8px;padding:8px 10px}}

img.ava{object-fit:cover;display:block;background:var(--panel2);flex:none}
.prof-card img.ava{border-radius:28px}
.drop-ava{border-radius:32px;padding:4px;border:2px dashed transparent;transition:border-color .15s}
.drop-ava.over{border-color:var(--accent)}
.field.dim .pick{opacity:.5}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.field label.btn{cursor:pointer;font-size:15px;color:var(--text)}

footer{max-width:1240px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
footer p{margin:4px 0;max-width:75ch}

@media (max-width:640px){
  .view-head h1{font-size:24px}
  .cell{flex-basis:96px;height:96px}
  .cell .art{top:10px;height:44px}
  .roll{height:118px}
  .wallet .bal{padding:6px 10px}
  .logo small{display:none}
}
@media (prefers-reduced-motion:reduce){
  .won .item{animation:none}
  .case{transition:none}
}

/* ===== Редизайн: графит + жёлтый ===== */
header{background:rgba(20,20,20,.96);border-bottom:1px solid var(--line)}
.bar{max-width:none;display:grid;grid-template-columns:auto 1fr auto;gap:20px;padding:0 20px;height:64px}
.logo b{font-size:22px}
.logo b span{color:var(--accent)}
nav{justify-self:center;gap:6px;height:100%}
nav a{position:relative;display:flex;align-items:center;height:100%;padding:0 12px;border-radius:0;background:none!important;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:800}
nav a:hover{color:var(--text)}
nav a.on{color:var(--accent)}
nav a.on::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav a .cnt{background:var(--panel2);color:var(--text)}
.right{display:flex;align-items:center;gap:10px}
.bal{background:var(--panel2);border-color:var(--line);font-size:15px}
.bal .num{color:var(--accent)}
.btn{background:var(--panel2);border-color:var(--line);border-radius:10px}
.btn:hover{border-color:#3d3d3d;background:#2a2a2a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 24px -8px rgba(255,200,0,.55)}
.btn.primary:hover{background:#ffd633}
.btn.primary:disabled{box-shadow:none}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);align-items:start}
.feed{position:sticky;top:64px;height:calc(100vh - 64px);border-right:1px solid var(--line);border-bottom:0;background:var(--bg2);overflow:auto}
.feed-in{max-width:none;flex-direction:column;align-items:stretch;padding:10px;gap:6px;overflow:visible}
.feed-label{padding:4px 4px 6px;font-weight:800}
.feed-empty{padding:4px;line-height:1.4}
.drop{flex:none;width:100%;height:78px;border-radius:8px;border-bottom:0;border-left:3px solid var(--rc);background:linear-gradient(90deg, color-mix(in srgb, var(--rc) 28%, #1c1c1c) 0%, #1c1c1c 75%)}
.drop .art{inset:6px 6px 26px 40px;width:auto;height:auto}
.drop span{left:10px;right:8px;bottom:6px;font-size:10px;line-height:1.25;color:var(--muted)}
.drop span b{display:block;color:var(--text);font-size:12px;font-family:var(--display);font-weight:400;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.col{min-width:0}
main{padding:28px 24px 40px}
footer{max-width:1240px;border-top:0;padding:0 24px 28px;font-size:12px;margin:0 auto}
footer p{margin:0}
.view-head{margin-bottom:20px}
.view-head h1{font-size:26px;text-transform:uppercase;letter-spacing:.04em}

.panel,.stat,.case,.opener,.empty,.modal,.row{background:var(--panel);border-color:var(--line)}
.case{border-radius:12px;align-items:stretch}
.case::before{opacity:.12}
.case h3{font-size:17px}
.price{color:var(--accent)}

/* карточки предметов */
.item{background:linear-gradient(180deg,#222 0%,#1b1b1b 100%);border-radius:10px;border-bottom:2px solid var(--rc)}
.item::before{top:auto;bottom:0;height:100%;background:radial-gradient(120px 70px at 50% 85%, var(--rc), transparent 75%);opacity:.22}
.mini{background:linear-gradient(180deg,#232323 0%,#1b1b1b 100%);border-bottom:2px solid var(--rc);text-align:center;align-items:center;padding:6px 8px 8px;gap:0}
.mini::before{inset:0;background:radial-gradient(80px 50px at 50% 80%, var(--rc), transparent 75%);opacity:.25}
.mini.on{outline:2px solid var(--accent);background:linear-gradient(180deg,#2b2614 0%,#1b1b1b 100%)}
.m-top{display:flex;justify-content:space-between;width:100%;font-size:10px;color:var(--muted);font-weight:700;position:relative}
.m-top .price{font-size:11px;font-family:var(--mono)}
.mini .art{height:44px;margin:4px 0}
.mini small{font-size:10px;max-width:100%}
.mini b{font-size:12px;font-family:var(--display);font-weight:400;letter-spacing:.02em;max-width:100%}
.minis{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));max-height:430px}
.empty-note{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0;margin:0}

/* апгрейд */
.upg-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px) minmax(0,1fr);gap:20px;align-items:stretch;max-width:1200px;margin:0 auto}
.slot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:330px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.ghost{position:absolute;width:85%;left:7.5%;top:50%;transform:translateY(-50%) rotate(-12deg);fill:#ffffff;opacity:.035}
.slot-empty{position:relative;display:grid;gap:4px;text-align:center}
.slot-empty b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em}
.slot-empty span{color:var(--muted);font-size:13px}
.slot-head{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.slot-head b{color:var(--accent);font-size:18px;letter-spacing:0}
.stake-grid{display:grid;gap:8px;width:100%;margin-top:30px}
.stake-grid.n1{grid-template-columns:1fr}.stake-grid.n2{grid-template-columns:1fr 1fr}.stake-grid.n3,.stake-grid.n4,.stake-grid.n5,.stake-grid.n6{grid-template-columns:repeat(3,1fr)}
.stake-it{background:radial-gradient(90px 50px at 50% 70%, color-mix(in srgb, var(--rc) 35%, transparent), transparent 75%), var(--panel2);border-radius:10px;border-bottom:2px solid var(--rc);padding:8px;display:grid;gap:4px;text-align:center}
.stake-grid.n1 .stake-it .art{height:120px}.stake-grid.n2 .stake-it .art{height:80px}
.stake-it .art{width:100%;height:52px}
.stake-it span{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal{width:100%;display:grid;justify-items:center;gap:4px;text-align:center;padding-top:20px;background:radial-gradient(180px 90px at 50% 45%, color-mix(in srgb, var(--rc) 30%, transparent), transparent 75%)}
.goal .art{width:100%;height:140px}
.goal small{color:var(--muted)}
.goal b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em}
.gauge{display:flex;align-items:center;justify-content:center}
.wheel{width:100%;max-width:330px}
.wheel-pct{font-size:36px}
.wheel-lbl{font-size:14px}
.upg-go{display:flex;justify-content:center;align-items:center;gap:16px;margin:22px 0 28px;flex-wrap:wrap}
.up-go{width:min(340px,100%);font-size:18px;padding:16px 20px;border-radius:12px;font-weight:800}
.upg-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.upg-bottom .panel{padding:0;gap:0;overflow:hidden;align-content:start}
.upg-bottom .ph{padding:14px 16px;background:#202020;border-bottom:1px solid var(--line);align-items:center}
.upg-bottom .minis{padding:12px}
.filters{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;padding:12px 12px 0}
.filters input{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit;min-width:0;width:100%}
#up-q{width:100%}

@media (max-width:1100px){.upg-top{grid-template-columns:1fr 1fr}.gauge{grid-column:1/-1;order:-1}.upg-bottom{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .feed{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .feed-in{flex-direction:row;overflow-x:auto;align-items:center}
  .drop{width:150px;flex:0 0 150px}
  .bar{grid-template-columns:auto auto;height:auto;padding:10px 16px;row-gap:6px}
  nav{grid-column:1/-1;order:3;justify-self:stretch;overflow-x:auto;height:40px}
  main{padding:20px 16px 32px}
}
@media (max-width:560px){.upg-top{grid-template-columns:1fr}.slot{min-height:220px}.filters{grid-template-columns:1fr 1fr}.filters #up-q{grid-column:1/-1}}

/* лента и скроллбары */
html,*{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0;display:none}
.feed{overflow:hidden}
.feed-in{overflow:hidden}
.feed-label{display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(62,207,110,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,110,.55)}70%{box-shadow:0 0 0 7px rgba(62,207,110,0)}100%{box-shadow:0 0 0 0 rgba(62,207,110,0)}}
.drop{height:100px}
.drop .art{inset:auto;top:8px;right:8px;left:42%;height:40px;width:auto}
.drop > span{top:50px;bottom:auto}
.d-price{position:absolute;top:8px;left:10px;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
.d-who{position:absolute;left:10px;right:8px;bottom:5px;display:flex;align-items:center;gap:5px;font-style:normal;font-size:10px;color:var(--muted);overflow:hidden}
.d-who .ava{border-radius:4px;width:14px;height:14px}
.d-who span{position:static;left:auto;right:auto;bottom:auto;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop.enter{animation:dropIn .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes dropIn{from{max-height:0;opacity:0;transform:translateY(-14px) scale(.96);margin-bottom:-6px}to{max-height:100px;opacity:1;transform:none;margin-bottom:0}}
@media (max-width:900px){.feed-in{overflow-x:auto}.drop{height:100px}@keyframes dropIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.drop.enter,.live-dot{animation:none}}

/* запрет выделения и копирования */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}

/* байтовая рулетка */
.cell{transition:transform .14s ease-out, filter .2s, box-shadow .2s}
.cell.hot{transform:scale(1.06);filter:brightness(1.3)}
.roll.tense::after{animation:mk .35s infinite alternate;box-shadow:0 0 18px var(--accent),0 0 46px var(--accent)}
.roll.tense{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
@keyframes mk{to{opacity:.45}}
.roll.done .cell{filter:brightness(.4) saturate(.5)}
.roll.done .cell.win{filter:none;transform:scale(1.1);z-index:1;box-shadow:0 0 0 2px var(--rc),0 0 30px var(--rc)}
.roll.shake{animation:shake .45s}
@keyframes shake{15%{transform:translateX(-5px)}35%{transform:translateX(5px)}55%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(circle at 50% 50%, var(--fc,transparent) 0%, transparent 62%)}
.flash.go{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--sc);z-index:4;pointer-events:none;animation:sp .95s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}.roll.tense::after{animation:none}}

/* байтовый апгрейд */
.gauge{position:relative}
.gauge.tense .wheel{filter:drop-shadow(0 0 14px rgba(255,200,0,.55));animation:gz .3s infinite alternate}
@keyframes gz{to{filter:drop-shadow(0 0 4px rgba(255,200,0,.2))}}
.gauge.won-fx .wheel{animation:gwin 1s ease-out}
.gauge.lost-fx .wheel{animation:glose .5s}
@keyframes gwin{0%{filter:drop-shadow(0 0 40px var(--good))}100%{filter:none}}
@keyframes glose{0%{filter:drop-shadow(0 0 30px var(--bad))}15%{transform:translateX(-6px)}35%{transform:translateX(6px)}55%{transform:translateX(-3px)}75%{transform:translateX(2px)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.gauge.tense .wheel{animation:none}}

.case-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.case-tools input,.case-tools select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font:inherit;min-width:0}
#cf-q{width:220px}#cf-min,#cf-max{width:100px}
@media (max-width:640px){.case-tools{width:100%}#cf-q{width:100%}#cf-min,#cf-max{flex:1}}
.view-head{align-items:center}
.new-tag{position:absolute;top:10px;left:10px;z-index:1;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.cases{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

/* профиль + инвентарь */
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:20px}
.pcard-ava{position:relative;border-radius:30px;padding:3px}
.pcard-ava .ava{border-radius:26px;display:block}
.ava-edit{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;border:3px solid var(--panel)}
.ava-edit:hover{background:#ffd633}
.pcard-main{display:grid;gap:10px;min-width:0}
.nick-form{display:flex;gap:8px;max-width:420px}
.nick-form input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--text);font:inherit;font-size:26px;padding:4px 8px;margin-left:-9px}
.nick-form input:hover,.nick-form input:focus{border-color:var(--line);background:var(--panel2)}
.nick-form .btn{flex:none}
.pcard-lvl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pcard .xpbar{max-width:420px}
.pcard .sync{max-width:640px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.linkish:hover{color:var(--text)}
.pstats{margin:14px 0 0}
.stat b.best{font-size:14px;font-family:var(--body)}
.section-title h2 .hint{font-size:14px;margin-left:8px;letter-spacing:0}
@media (max-width:560px){.pcard{grid-template-columns:1fr;justify-items:center;text-align:center}.nick-form,.pcard .xpbar{margin:0 auto}.pcard-lvl{justify-content:center}}

.wheel-miss{font-family:var(--display);font-size:30px;fill:var(--bad);letter-spacing:.08em}
.wheel-miss.ok{fill:var(--good)}
.goal .btn{margin-top:8px}
.wheel-lost{font-family:var(--mono);font-size:20px;fill:var(--text)}

.case-result{display:grid;gap:10px}
.case-result[hidden]{display:none}
.cr-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}
.cr-head b{color:var(--text)}
.cr-head .pos{color:var(--good)} .cr-head .neg{color:var(--bad)}
.cr-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cr-it{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto auto;gap:4px 10px;align-items:center;background:radial-gradient(120px 50px at 15% 50%, color-mix(in srgb, var(--rc) 28%, transparent), transparent 75%), var(--panel2);border:1px solid var(--line);border-left:3px solid var(--rc);border-radius:10px;padding:8px 10px;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.cr-it .art{grid-row:1 / span 2;width:72px;height:36px}
.cr-t{display:grid;line-height:1.25;min-width:0}
.cr-t small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-it .btn,.cr-it .hint{grid-column:2;justify-self:start;padding:5px 10px;font-size:13px;white-space:nowrap}
.cr-it.sold{opacity:.5;filter:grayscale(.6)}
@media (prefers-reduced-motion:reduce){.cr-it{animation:none}}

/* вход в апгрейд */
.upg-top.intro .gauge .wheel{animation:wheelIn .9s cubic-bezier(.2,1.1,.35,1) both}
.upg-top.intro .slot:first-child{animation:slideL .6s cubic-bezier(.2,1,.3,1) both}
.upg-top.intro .slot:last-child{animation:slideR .6s cubic-bezier(.2,1,.3,1) both}
@keyframes wheelIn{from{opacity:0;transform:scale(.82) rotate(-35deg)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* объявление и админка */
.announce{display:flex;align-items:center;gap:12px;margin:16px 24px 0;padding:10px 12px 10px 14px;border-radius:12px;background:color-mix(in srgb, var(--accent) 14%, var(--panel));border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line))}
.announce[hidden]{display:none}
.ann-ico{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.ann-t{flex:1;white-space:pre-wrap;word-break:break-word}
.announce .icon-btn{width:32px;height:32px;flex:none}
.adm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
.adm-wide{grid-column:1/-1}
.adm textarea,.adm input[type=number],.adm input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:10px;font:inherit;min-width:0;width:100%}
.adm textarea{resize:vertical}
.adm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint.ok{color:var(--good)}
.adm-form{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px 12px;align-items:center}
.adm-form label{display:grid;font-size:14px}
.adm-form label small{color:var(--muted);font-size:11px}
.adm-drops{display:grid;gap:6px}
.adm-drop{display:grid;grid-template-columns:70px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 10px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--rc)}
.adm-drop .art{grid-row:1/span 2;width:70px;height:32px}
.adm-drop span{display:grid;font-size:11px;color:var(--muted);line-height:1.3}
.adm-drop span b{color:var(--text);font-size:13px}
.adm-drop i{display:flex;gap:6px;align-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.adm-drop i .ava{border-radius:4px}
.adm-drop em{font-style:normal}
.adm-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.adm-case{display:grid;grid-template-columns:10px minmax(0,1fr) 90px auto auto;grid-template-rows:auto auto;gap:2px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.adm-case .dot{grid-row:1/span 2;width:10px;height:10px;border-radius:3px}
.adm-case small{grid-column:2;grid-row:2;color:var(--muted);font-size:11px}
.adm-case input[type=number]{grid-row:1/span 2;grid-column:3}
.adm-case label{grid-row:1/span 2;display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.adm-case input[type=checkbox]{accent-color:var(--accent)}
.adm-case.off{opacity:.5}
.adm .ph input[type=search]{width:220px}
.adm-players{display:grid;gap:6px}
.adm-pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.adm-pl .ava{border-radius:9px}
.adm-pl .who{display:grid;line-height:1.3;min-width:0}
.adm-pl .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-pl .who small{color:var(--muted);font-size:12px}
.adm-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.adm-act input{width:90px!important}
.adm-act .btn{padding:6px 10px;font-size:13px}
.adm-pl [data-msg]{grid-column:2/-1}
.adm-pl [data-msg]:empty{display:none}
.adm-sub{font-size:15px;margin:14px 0 4px}
@media (max-width:1100px){.adm{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.adm{grid-template-columns:1fr}.adm-pl{grid-template-columns:auto minmax(0,1fr)}.adm-act{grid-column:1/-1;justify-content:flex-start}.adm-case{grid-template-columns:10px minmax(0,1fr) 80px}.adm-case label{grid-row:auto}}
@media (max-width:900px){.announce{margin:12px 16px 0}}

.up-go.skip{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:none}
.up-go.skip:hover{background:#2a2a2a}

.m-ch{position:absolute;right:6px;top:28px;font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.6);color:var(--muted)}
.m-ch.mid{color:#facc15}.m-ch.hi{color:var(--good)}
.adm-luck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.adm-luck select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.adm-pl.lucky .adm-luck select{border-color:var(--good);color:var(--good)} .adm-pl.unlucky .adm-luck select{border-color:var(--bad);color:var(--bad)}
.cr-hist{display:flex;gap:6px;overflow:hidden;margin-bottom:10px;min-height:28px;align-items:center}
.cr-chip{flex:none;font-family:var(--mono);font-size:13px;padding:4px 9px;border-radius:8px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.cr-chip.hi{color:var(--good)} .cr-chip.gold{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.cr-stage{position:relative;padding:0;overflow:hidden;margin-bottom:12px}
.cr-stage canvas{display:block;width:100%;height:340px}
.cr-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:4px;padding-bottom:20px}
.cr-big{font-size:64px;line-height:1;color:var(--text);font-family:var(--mono);text-shadow:0 2px 16px rgba(0,0,0,.6)}
.cr-big.bad{color:var(--bad)} .cr-big.good{color:var(--good)}
#cr-small{color:var(--muted);font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.cr-ctl{grid-template-columns:1fr 1fr auto;align-items:end;gap:14px}
.cr-field{display:grid;gap:6px;min-width:0}
.cr-field label{color:var(--muted);font-size:13px}
.cr-row{display:flex;gap:6px;min-width:0}
.cr-row input{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:8px 10px}

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  const pools = POOLS.map(p=>shuffle(p,r));
  const knives = shuffle(KNIVES,r);
  const used = [0,0,0,0,0];
  c.skins = LAYOUT.map((rar,i)=>{
    const weapon = rar===4 ? knives[used[4]++] : pools[rar][used[rar]++];
    const type = rar===4 ? "knife" : WTYPE[weapon];
    const pair = c.pal[Math.floor(r()*c.pal.length)];
    const pt = ["grad","stripes","camo","dots"][Math.floor(r()*4)];
    const blobs = Array.from({length:9},()=>[r()*200,r()*80,8+r()*22,4+r()*10,r()*180]);
    return {i, rar, weapon, type, knife:rar===4, name:c.names[i], case:c.id, c:pair, pt, blobs, f:0.85+r()*0.35};
  });
  c.defPrice = c.price; c.defNew = !!c.isNew; c.off = false;
});
function recomputeCases(){
  CASES.forEach(c=>{
    // множитель цены, чтобы средняя отдача кейса была RTP
    let ev=0;
    for(let k=0;k<5;k++){
      const s=c.skins.filter(x=>x.rar===k);
      ev += RAR[k].p * RAR[k].base * s.reduce((a,x)=>a+x.f,0)/s.length;
    }
    ev *= E_WEAR*E_ST;
    c.m = (c.rtp || RTP)*c.price/ev;
    c.skins.forEach(s=>{s.basePrice = RAR[s.rar].base*s.f*c.m; s.chance = RAR[s.rar].p / c.skins.filter(x=>x.rar===s.rar).length;});
    c.maxP = Math.max(...c.skins.map(s=>s.basePrice))*WEAR[0].m*ST_M;
    c.minP = Math.max(2, Math.round(Math.min(...c.skins.map(s=>s.basePrice))*WEAR[4].m));
  });
}

function pixelArt(sk){
  if(sk._px) return sk._px;
  const spr = WSPRITES[sk.weapon] || WSPRITES["AK-47"];
  const at = (x,y) => (y>=0 && y<PX_H && x>=0 && x<PX_W) ? spr[y][x] : ".";
  const look = (LOOK[sk.case] && LOOK[sk.case][sk.i]) || ["solid", sk.c[0], sk.c[1], "#ffffff"];
  const P = look.slice(1).map(hexRgb), pat = PAT[look[0]] || PAT.solid;
  const N = vnoise(hash(sk.case + "|" + sk.i));
  const METAL = [43,47,56], METAL_L = [96,104,118], OUT = "#0b0b0e";
  const grid = [];
  for(let y=0;y<PX_H;y++) for(let x=0;x<PX_W;x++){
    const ch = at(x,y); let col = null;
    if(ch==="x"){
      col = pat(x, y, P, N);
      const lum = col[0]*.3 + col[1]*.59 + col[2]*.11;
      if(lum < 26) col = mix(col, [70,70,90], .35);   // совсем чёрное не сливается с фоном
      if(at(x,y-1)===".") col = shade(col, 0.25);       // свет сверху
      else if(at(x,y+1)===".") col = shade(col, -0.28); // тень снизу
    } else if(ch==="m") col = at(x,y-1)==="." ? shade(METAL, 0.18) : METAL;
    else if(ch==="h") col = at(x,y-1)==="." ? shade(METAL_L, 0.25) : METAL_L;
    else if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(x+dx,y+dy)!==".")) col = OUT;
    grid.push(col ? (typeof col==="string" ? col : rgbHex(col)) : null);
  }
  if(sk.rar>=2){ // блики у дорогих редкостей
    const rr = rng(hash(sk.case + "|" + sk.i + "|glint")), n = sk.rar>=4 ? 5 : sk.rar>=3 ? 3 : 1, cells = [];
    for(let y=0;y<PX_H;y++) for(let x=0;x<PX_W;x++) if(at(x,y)==="x" && at(x,y-1)===".") cells.push(y*PX_W+x);
    for(let k=0;k<n && cells.length;k++){ const i = cells.splice(Math.floor(rr()*cells.length),1)[0]; grid[i] = "#ffffff"; }
  }
  const byCol = {};
  for(let y=0;y<PX_H;y++){ let x = 0;
    while(x<PX_W){ const c = grid[y*PX_W+x]; if(!c){ x++; continue; } let w = 1; while(x+w<PX_W && grid[y*PX_W+x+w]===c) w++; (byCol[c] = byCol[c] || []).push(`M${x} ${y}h${w}v1h-${w}z`); x += w; } }
  return sk._px = `<svg class="art px" viewBox="-1 -1 ${PX_W+2} ${PX_H+2}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" aria-hidden="true">${Object.entries(byCol).map(([c,d])=>`<path fill="${c}" d="${d.join("")}"/>`).join("")}</svg>`;
}
function art(sk){ return pixelArt(sk); }

const CW = 64, CH = 44;
function caseArt(c){
  if(c._art) return c._art;
  const grid = new Array(CW*CH).fill(null);
  const put = (x,y,col) => { if(x>=0 && x<CW && y>=0 && y<CH && col) grid[y*CW+x] = typeof col==="string" ? col : rgbHex(col); };
  // тень и сундук
  const X0 = 13, X1 = 50, Y0 = 18, YL = 25, Y1 = 40;
  const body = hexRgb(c.accent), dark = shade(hexRgb(c.pal[0][0]), -.2), metal = [58,62,70], metalL = [128,136,148];
  for(let x=X0+2;x<=X1;x++) put(x, Y1+1, "rgba0");
  for(let y=Y0;y<=Y1;y++) for(let x=X0;x<=X1;x++){
    const edge = x===X0 || x===X1 || y===Y0 || y===Y1 || y===YL;
    let col;
    if(edge) col = "#0b0b0e";
    else if((x<=X0+2 || x>=X1-2) && (y<=Y0+2 || y>=Y1-2 || (y>=YL-1 && y<=YL+1))) col = (x+y)%2 ? metalL : metal; // уголки
    else if(y<YL) col = y===Y0+1 ? shade(dark, .25) : mix(dark, body, .25);                                 // крышка
    else { col = mix(body, dark, (y-YL)/(Y1-YL)*.55); if(x===X0+1) col = shade(col,.18); if(x===X1-1) col = shade(col,-.25); if(y===YL+1) col = shade(col,.2); if((x-X0)%9===0) col = shade(col,-.18); }
    put(x, y, col);
  }
  // ручка
  for(let x=27;x<=36;x++) put(x, Y0-3, "#0b0b0e"), put(x, Y0-2, x===27||x===36 ? "#0b0b0e" : metalL);
  for(let y=Y0-3;y<Y0;y++) put(27, y, "#0b0b0e"), put(36, y, "#0b0b0e");
  // эмблема на передней стенке (с тёмной плашкой под ней)
  const em = EMB[c.id];
  if(em){
    const rows = em.s.trim().split(/\s+/), ex = 25, ey = 26;
    for(let y=-1;y<=12;y++) for(let x=-1;x<=14;x++) put(ex+x, ey+y-1, mix(hexRgb("#101216"), body, .12));
    rows.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch===".") return; put(ex+x, ey+y-1, ch==="k" ? "#0b0b0e" : em.p[ch]); }));
  }
  // искры у дорогих кейсов
  const byCol = {};
  for(let y=0;y<CH;y++){ let x = 0; while(x<CW){ const col = grid[y*CW+x]; if(!col){ x++; continue; } let w = 1; while(x+w<CW && grid[y*CW+x+w]===col) w++; (byCol[col] = byCol[col] || []).push(`M${x} ${y}h${w}v1h-${w}z`); x += w; } }
  return c._art = `<svg class="case-art" viewBox="${X0-3} ${Y0-6} ${X1-X0+7} ${Y1-Y0+10}" shape-rendering="crispEdges" aria-hidden="true">${Object.entries(byCol).map(([col,d])=>`<path fill="${col==="rgba0" ? "#000" : col}"${col==="rgba0" ? ' opacity=".45"' : ""} d="${d.join("")}"/>`).join("")}</svg>`;
}

function xpOf(st){ const t=st.stats; return t.opened*10 + t.upg*6 + t.runs*4 + Math.floor(t.runEarned/20); }
function levelOf(xp){ let L=1; while(xp >= 30*L*(L+1)) L++; const lo=30*(L-1)*L, hi=30*L*(L+1); return {lvl:L, lo, hi, p:(xp-lo)/(hi-lo)}; }

function rankOf(L){ let r=RANKS[0][1]; RANKS.forEach(([n,t])=>{ if(L>=n) r=t; }); return r; }
const AV_COLORS = ["#f5a524","#ef5350","#ec4899","#8b5cf6","#4b69ff","#22d3ee","#3ecf6e","#94a3b8"];
function avatar(av, size, nick){
  const c = AV_COLORS[(av&&av.c)|0] ? (av.c|0) : 0;
  const ch = esc((String(nick||"?").trim().charAt(0) || "?").toUpperCase());
  return `<svg class="ava" viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><rect width="40" height="40" rx="11" fill="${AV_COLORS[c]}"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Tiny5 Duo, monospace" font-size="22" fill="#0d1015">${ch}</text></svg>`;
}
const IMG_RE = /^data:image\/(jpeg|webp|png);base64,[A-Za-z0-9+\/=]+$/;
const validImg = v => typeof v==="string" && v.length < 90000 && IMG_RE.test(v);
function avatarOf(p, size){
  if(p && validImg(p.img)) return `<img class="ava" src="${p.img}" width="${size}" height="${size}" alt="">`;
  return avatar(p && p.av, size, p && p.nick);
}
async function processAvatar(file){
  if(!file || !/^image\//.test(file.type)) throw new Error("Это не картинка. Выберите файл JPG, PNG, WebP или GIF.");
  if(file.size > 10*1024*1024) throw new Error("Файл больше 10 МБ. Выберите картинку поменьше.");
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Не удалось прочитать картинку. Попробуйте другой файл.")); i.src=url; });
    const N = 160, cv = document.createElement("canvas"); cv.width = N; cv.height = N;
    const ctx = cv.getContext("2d");
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth-side)/2, sy = (img.naturalHeight-side)/2;
    ctx.fillStyle = "#151a22"; ctx.fillRect(0,0,N,N);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, sx, sy, side, side, 0, 0, N, N);
    let out = "";
    for(const q of [0.85, 0.7, 0.55, 0.4]){
      out = cv.toDataURL("image/webp", q);
      if(!out.startsWith("data:image/webp")) out = cv.toDataURL("image/jpeg", q);
      if(out.length < 60000) break;
    }
    if(!validImg(out)) throw new Error("Не удалось сжать картинку. Попробуйте другой файл.");
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Розыгрыш ---------- */
/* Персональная удача игрока (задаёт админ): 1 — обычные шансы, 1.5 — отдача ×1,5, 0.5 — вдвое меньше.
 * Цены предметов не меняются — меняются вероятности редкостей, чтобы средняя отдача кейса стала RTP × удача.
 * Игрок видит свои настоящие шансы и RTP на странице кейса и в апгрейде. */
const myLuck = () => { const v = CL.id && CFG.luck ? Number(CFG.luck[CL.id]) : 1; return isFinite(v) && v>0 ? Math.min(5, Math.max(0.1, v)) : 1; };
const oddsCache = {};
function caseOdds(c){
  const L = myLuck(), key = c.id+"|"+L+"|"+c.m;
  if(oddsCache[key]) return oddsCache[key];
  const base = RAR.map(r=>r.p);
  const v = RAR.map((r,k)=>{ const s = c.skins.filter(x=>x.rar===k); return r.base*s.reduce((a,x)=>a+x.f,0)/s.length; });
  const ev0 = base.reduce((a,p,k)=>a+p*v[k],0);
  const tilt = t => { const w = base.map((p,k)=>p*Math.pow(v[k],t)); const z = w.reduce((a,b)=>a+b,0); return w.map(x=>x/z); };
  let p = base;
  if(L!==1){
    const ratio = t => tilt(t).reduce((a,q,k)=>a+q*v[k],0)/ev0;
    let lo = -12, hi = 12;
    for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(ratio(mid) < L) lo = mid; else hi = mid; }
    p = tilt((lo+hi)/2);
  }
  const k = p.reduce((a,q,i)=>a+q*v[i],0)/ev0;
  return oddsCache[key] = {p, rtp:(c.rtp||RTP)*k};
}
function pickRarity(c){ const p = c ? caseOdds(c).p : RAR.map(r=>r.p); let x=Math.random(), acc=0; for(let i=0;i<5;i++){ acc+=p[i]; if(x<acc) return i; } return 0; }
function pickSkin(c, fair){ const rar=pickRarity(fair ? c : null); const list=c.skins.filter(s=>s.rar===rar); return list[Math.floor(Math.random()*list.length)]; }
function roll(c){
  const sk = pickSkin(c, true);
  let x=Math.random(), acc=0, w=2;
  for(let i=0;i<WEAR.length;i++){ acc+=WEAR[i].p; if(x<acc){w=i;break;} }
  const fl = WEAR[w].min + Math.random()*(WEAR[w].max-WEAR[w].min);
  const st = Math.random()<ST_P;
  const price = Math.max(2, Math.round(sk.basePrice*WEAR[w].m*(st?ST_M:1)));
  return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), c:c.id, s:sk.i, w, fl:+fl.toFixed(4), st, price, t:Date.now()};
}

/* ---------- Случайный выбор сценария без повторов ---------- */
const lastMode = {};
function pickMode(key, weights){
  // weights: {mode: вес}; сильные приёмы не повторяются подряд, а после них чаще идёт обычная остановка
  const prev = lastMode[key];
  const w = Object.assign({}, weights);
  if(prev && prev!=="plain" && w[prev]) w[prev] = 0;
  if(prev && prev!=="plain") w.plain = (w.plain||0)*1.4;
  const total = Object.values(w).reduce((a,b)=>a+b,0);
  let x = Math.random()*total;
  for(const [m,v] of Object.entries(w)){ x -= v; if(x <= 0){ lastMode[key] = m; return m; } }
  lastMode[key] = "plain"; return "plain";
}

function beep(freq,dur,vol,type){ const a=audio(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type||"square"; o.frequency.value=freq; g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur); }

  btn.disabled = spinning || !enough;
  hint.className = "hint" + (enough ? "" : " err");

function buildStrip(c, winner, len, winIdx, baitIdx){
  const cells = [];
  const wsk = skinOf(winner);
  const baits = c.skins.filter(x=>x.rar>=3 && x!==wsk);
  const bait = baits[Math.floor(Math.random()*baits.length)];
  for(let i=0;i<len;i++){
    const sk = i===winIdx ? wsk : (i===baitIdx && bait) ? bait : pickSkin(c);
    cells.push(`<div class="cell" style="--rc:${RAR[sk.rar].color}">${art(sk)}<span><b>${esc(sk.name)}</b>${esc(title(sk))}</span></div>`);
  }
  return cells.join("");
}

async function openCases(c){
  if(spinning) return;
  const n = S.n, cost = Math.round(c.price*n*100)/100;
  if(S.bal < cost - 1e-9){ updateOpenBtn(c); return; }
  spinning = true;
  audio();
  S.bal = Math.round((S.bal-cost)*100)/100;
  S.stats.opened += n; S.stats.spent = Math.round((S.stats.spent+cost)*100)/100;
  vaultAdd(cost);
  const wins = Array.from({length:n},()=>roll(c));
  // сразу кладём в инвентарь, чтобы ничего не потерялось при уходе со страницы
  const bc = S.stats.byCase[c.id] = S.stats.byCase[c.id] || [0,0,0]; // [открыто, потрачено, выпало]
  bc[0] += n; bc[1] = Math.round(bc[1] + cost);
  wins.forEach(it=>{
    S.inv.unshift(it);
    bc[2] = Math.round(bc[2] + it.price);
    S.stats.won = Math.round((S.stats.won+it.price)*100)/100;
    if(!S.stats.best || it.price > S.stats.best.price) S.stats.best = it;
  });
  save(); renderHeader(); updateOpenBtn(c);
  document.querySelectorAll(".seg button").forEach(b=>b.disabled=true);

  const crBox = document.getElementById("case-result"); if(crBox){ crBox.hidden = true; crBox.innerHTML = ""; }
  const rolls = document.getElementById("rolls");
  const LEN = 64, WIN = 52;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const plain = reduce || S.fast;
  const plans = wins.map(()=>{
    const mode = plain ? "plain" : pickMode("case", {plain:46, soft:24, edge:12, pull:10, fall:8});
    let bait = -1;
    if(mode==="pull" || mode==="edge") bait = WIN+1;
    else if(mode==="fall") bait = WIN-1;
    else if(!plain && Math.random() < 0.35) bait = WIN + [-3,-2,2,3,4][Math.floor(Math.random()*5)];
    return {mode, bait};
  });
  const vert = wins.length > 1;
  rolls.classList.toggle("vert", vert);
  rolls.style.setProperty("--n", wins.length);
  rolls.innerHTML = wins.map((w,i)=>`<div class="roll"><div class="strip">${buildStrip(c,w,LEN,WIN, plans[i].bait)}</div><i class="flash"></i></div>`).join("");
  const outQuart = k=>1-Math.pow(1-k,4), outQuint = k=>1-Math.pow(1-k,5), inOut = k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const strips = [...rolls.querySelectorAll(".strip")].map((el,i)=>{
    const r0 = el.children[0].getBoundingClientRect();
    const cellW = vert ? r0.height : r0.width, step = cellW + 10, cw = vert ? el.parentElement.clientHeight : el.parentElement.clientWidth;
    const pos = (idx,off)=> idx*step + cellW/2 + off*cellW - cw/2;
    const D = reduce ? 500 : (S.fast ? 1400 : rnd(5200,7200));
    const m = plans[i].mode, side = Math.random()<.5 ? -1 : 1;
    let segs;
    if(m==="plain") segs = [{to:pos(WIN,rnd(-.44,.44)), d:D, e:Math.random()<.5?outQuart:outQuint}];
    else if(m==="soft") segs = [{to:pos(WIN,side*rnd(.3,.42)), d:D+rnd(200,700), e:outQuint}];
    else if(m==="pull") segs = [{to:pos(WIN+1,rnd(-.46,-.15)), d:D, e:outQuint}, {hold:rnd(250,650)}, {to:pos(WIN,rnd(-.1,.4)), d:rnd(550,950), e:inOut}];
    else if(m==="edge") segs = [{to:pos(WIN,rnd(.4,.485)), d:D+rnd(500,1200), e:outQuint}, {hold:rnd(100,300)}];
    else segs = [{to:pos(WIN-1,rnd(.15,.44)), d:D, e:outQuint}, {hold:rnd(350,750)}, {to:pos(WIN,rnd(-.47,-.2)), d:rnd(800,1400), e:inOut}];
    return {el, roll:el.parentElement, cells:el.children, step, cw, segs, seg:0, t0:null, from:0, x:0, done:false, hot:-1, plain:m==="plain"||m==="soft"};
  });
  if(!plain && S.sound) whoosh();
  await new Promise(res=>{
    let lastNow = performance.now();
    function next(s, now){ s.seg++; s.t0 = now; s.from = s.x; if(s.seg>=s.segs.length) s.done = true; else if(s.segs[s.seg].hold && !S.fast) beep(80,.22,.07,"sine"); }
    function frame(now){
      const dt = Math.max(1, now-lastNow); lastNow = now;
      let all = true;
      strips.forEach((s,si)=>{
        if(s.done) return; all = false;
        if(s.t0===null){ s.t0 = now; s.from = s.x; }
        const g = s.segs[s.seg], el = now - s.t0, px = s.x;
        if(g.hold){ if(el >= g.hold) next(s, now); }
        else { const k = Math.min(1, el/g.d); s.x = s.from + (g.to - s.from)*g.e(k); if(k>=1) next(s, now); }
        s.el.style.transform = vert ? `translateY(${-s.x}px)` : `translateX(${-s.x}px)`;
        const speed = Math.abs(s.x - px)/dt*16.7;
        s.roll.classList.toggle("tense", !s.plain && s.t0!==null && speed < 2.2 && !s.done);
        const cur = Math.floor((s.x + s.cw/2)/s.step);
        if(cur !== s.hot){
          if(s.cells[s.hot]) s.cells[s.hot].classList.remove("hot");
          s.hot = cur; if(s.cells[cur]) s.cells[cur].classList.add("hot");
          if(si===0 && S.sound) tick(speed < 3);
        }
      });
      if(all || !document.body.contains(strips[0].el)) res(); else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  // эффект остановки
  strips.forEach((s,i)=>{
    const sk = skinOf(wins[i]), col = RAR[sk.rar].color;
    s.roll.classList.remove("tense");
    [...s.cells].forEach(c=>c.classList.remove("hot"));
    if(s.cells[WIN]) s.cells[WIN].classList.add("win");
    s.roll.classList.add("done");
    if(reduce) return;
    s.roll.classList.add("shake");
    const fl = s.roll.querySelector(".flash"); fl.style.setProperty("--fc", col); fl.classList.add("go");
    if(sk.rar >= 2){
      const n = sk.rar >= 3 ? 26 : 12;
      for(let k=0;k<n;k++){
        const sp = document.createElement("i"); sp.className = "spark";
        const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*(sk.rar>=3?170:90);
        sp.style.setProperty("--dx", Math.cos(ang)*dist+"px"); sp.style.setProperty("--dy", Math.sin(ang)*dist*0.55+"px"); sp.style.setProperty("--sc", k%3 ? col : "#ffc800");
        s.roll.appendChild(sp);
      }
    }
  });
  spinning = false;
  S.recent = wins.slice().reverse().concat(S.recent).slice(0,14);
  save(); renderHeader();
  const epic = wins.filter(w=>isEpic(w, c)).sort((a,b)=>b.price-a.price)[0];
  if(epic) epicDrop(epic, c); else winSound(Math.max(...wins.map(w=>skinOf(w).rar)));
  await new Promise(r=>setTimeout(r, reduce ? 0 : (S.fast ? 400 : 1000)));
  showCaseResult(wins, c);
  if(document.getElementById("open")){
    document.querySelectorAll(".seg button").forEach(b=>b.disabled=false);
    updateOpenBtn(c);
  }
}


/* ---------- Звук прокрутки рулетки: щелчок «трещотки» ---------- */
let tickBuf = null;
function tick(slow){
  const a = audio(); if(!a) return;
  if(!tickBuf){ const n = Math.floor(a.sampleRate*0.02); tickBuf = a.createBuffer(1, n, a.sampleRate); const d = tickBuf.getChannelData(0); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 3); }
  const t = a.currentTime, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = tickBuf; f.type = "bandpass"; f.frequency.value = slow ? 3200 : 2400; f.Q.value = 2.5;
  g.gain.setValueAtTime(slow ? 0.55 : 0.32, t);
  src.connect(f).connect(g).connect(a.destination); src.start(t);
  const o = a.createOscillator(), og = a.createGain(); o.type = "square"; o.frequency.value = slow ? 1250 : 980;
  og.gain.setValueAtTime(slow ? 0.035 : 0.02, t); og.gain.exponentialRampToValueAtTime(0.0001, t+0.03);
  o.connect(og).connect(a.destination); o.start(t); o.stop(t+0.035);
}
function whoosh(){
  const a = audio(); if(!a) return;
  const n = Math.floor(a.sampleRate*0.6), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.sin(Math.PI*i/n);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  src.buffer = b; f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(3000, t+0.5);
  g.gain.value = 0.18; src.connect(f).connect(g).connect(a.destination); src.start(t);
}

/* ---------- Музыка в «Заработать»: своя 8-битная мелодия или свой трек с устройства ---------- */
const MUS = {timer:0, next:0, step:0, gain:null, on:false, audioEl:null, url:""};
const NOTE = n => 440*Math.pow(2,(n-69)/12);
// 4 такта по 8 восьмых: Am – F – C – G
const MEL = [69,72,76,72, 74,72,69,67,  65,69,72,69, 72,74,72,69,  67,72,76,79, 77,76,74,72,  67,71,74,71, 74,76,74,71];
const BAS = [45,45,57,45, 45,45,57,45,  41,41,53,41, 41,41,53,41,  48,48,60,48, 48,48,60,48,  43,43,55,43, 43,43,55,43];
function chipNote(a, type, freq, t, dur, vol){ const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); o.connect(g).connect(MUS.gain); o.start(t); o.stop(t+dur+0.02); }
function chipHat(a, t, vol){ const n = Math.floor(a.sampleRate*0.04), b = a.createBuffer(1,n,a.sampleRate), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = "highpass"; f.frequency.value = 6000; g.gain.value = vol; s.connect(f).connect(g).connect(MUS.gain); s.start(t); }
function chipStart(){
  const a = audio(); if(!a || MUS.timer) return;
  MUS.gain = a.createGain(); MUS.gain.gain.value = 0.5; MUS.gain.connect(a.destination);
  MUS.next = a.currentTime + 0.05; MUS.step = 0;
  const STEP = 60/150/2; // 150 BPM, восьмые
  MUS.timer = setInterval(()=>{
    if(!S.sound){ MUS.gain.gain.value = 0; } else MUS.gain.gain.value = 0.5;
    while(MUS.next < a.currentTime + 0.12){
      const i = MUS.step % 32, t = MUS.next, bar = Math.floor(MUS.step/32) % 2;
      chipNote(a, "square", NOTE(MEL[i] + (bar && i%8===7 ? 12 : 0)), t, STEP*0.9, 0.05);
      if(i%2===0) chipNote(a, "triangle", NOTE(BAS[i]), t, STEP*1.8, 0.16);
      chipHat(a, t, i%4===2 ? 0.09 : 0.04);
      if(i%8===0 || i%8===5) chipNote(a, "sine", 70, t, 0.12, 0.35);
      MUS.next += STEP; MUS.step++;
    }
  }, 25);
}
function chipStop(){ clearInterval(MUS.timer); MUS.timer = 0; if(MUS.gain){ try{ MUS.gain.disconnect(); }catch(e){} MUS.gain = null; } }
/* свой трек хранится только на этом устройстве (IndexedDB), на сервер не загружается */
function trackDB(){ return new Promise((res,rej)=>{ const r = indexedDB.open("kejsovnya-music", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("t"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function trackGet(){ try{ const db = await trackDB(); return await new Promise(res=>{ const q = db.transaction("t").objectStore("t").get("track"); q.onsuccess = ()=>res(q.result||null); q.onerror = ()=>res(null); }); }catch(e){ return null; } }
async function trackPut(file){ const db = await trackDB(); await new Promise((res,rej)=>{ const tx = db.transaction("t","readwrite"); tx.objectStore("t").put({blob:file, name:file.name}, "track"); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); }); }
async function musicStart(){
  if(MUS.on) return; MUS.on = true;
  const mode = S.music || "chip";
  if(mode==="off" || !S.sound) return;
  if(mode==="own"){
    const t = await trackGet(); if(!MUS.on) return;
    if(t && t.blob){
      if(!MUS.audioEl){ MUS.audioEl = new Audio(); MUS.audioEl.loop = true; MUS.audioEl.volume = 0.6; }
      if(!MUS.url){ MUS.url = URL.createObjectURL(t.blob); MUS.audioEl.src = MUS.url; }
      MUS.audioEl.play().catch(()=>{});
      return;
    }
  }
  chipStart();
}
function musicStop(){ MUS.on = false; chipStop(); if(MUS.audioEl) MUS.audioEl.pause(); }
function musicRestart(){ const was = MUS.on; musicStop(); if(was) musicStart(); }
async function drawMusicCtl(){
  const box = document.getElementById("mus"); if(!box) return;
  const t = await trackGet(), mode = S.music || "chip";
  box.innerHTML = `<span class="hint">Музыка:</span>
    ${[["chip","8-бит"],["own", t ? "Свой трек" : "Свой трек…"],["off","Выкл."]].map(([k,n])=>`<button type="button" class="btn${mode===k?' on':''}" data-mus="${k}">${n}</button>`).join("")}
    <label class="btn" for="mus-file">${t ? "Заменить файл" : "Загрузить mp3"}</label><input id="mus-file" type="file" accept="audio/*" hidden>
    ${t ? `<span class="hint mus-name"></span>` : ""}`;
  if(t){ box.querySelector(".mus-name").textContent = "♪ " + String(t.name||"трек").slice(0,40); }
  box.querySelectorAll("[data-mus]").forEach(b=>b.addEventListener("click", async ()=>{
    if(b.dataset.mus==="own" && !(await trackGet())){ document.getElementById("mus-file").click(); return; }
    b.blur(); S.music = b.dataset.mus; save(); musicRestart(); drawMusicCtl();
  }));
  document.getElementById("mus-file").addEventListener("change", async e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    if(f.size > 30*1024*1024){ box.querySelector(".hint").textContent = "Файл больше 30 МБ"; return; }
    try{ await trackPut(f); }catch(err){ return; }
    if(MUS.url){ URL.revokeObjectURL(MUS.url); MUS.url = ""; }
    S.music = "own"; save(); musicRestart(); drawMusicCtl();
  });
}

  upShownCh = 0;

  if(motionOK()){ top.classList.add("intro"); setTimeout(()=>top.classList.remove("intro"), 1000); }
  drawUpInv(); drawUpTargets(); drawUpMid();
  introNeedle();
}

function drawUpInv(){
  const box = document.getElementById("up-inv"); if(!box) return;
  const items = S.inv.slice().sort((a,b)=>b.price-a.price);
  document.getElementById("up-selinfo").textContent = `${upSel.size} / ${UP_SEL}`;
  box.innerHTML = items.length ? items.map(it=>mini(it, `data-id="${it.id}"${upSpinning?' disabled':''}`, upSel.has(it.id))).join("")
    : `<p class="empty-note">Инвентарь пуст. <a href="#cases">Откройте кейс</a></p>`;
  box.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>{
    if(upSpinning) return;
    const id=b.dataset.id;
    if(upSel.has(id)) upSel.delete(id); else if(upSel.size<UP_SEL) upSel.add(id); else return;
    if(upTarget && upTarget.price<=upStake()) upTarget=null;
    drawUpInv(); drawUpTargets(); drawUpMid();
  }));
}

function drawUpTargets(){
  const box = document.getElementById("up-tg"); if(!box) return;
  const st = upStake(), lo = +upMin || 0, hi = +upMax || Infinity;
  const list = CATALOG.filter(t=>t.price>st && t.price>=lo && t.price<=hi && (!upQuery || upQuery.split(/\s+/).every(w=>t.text.includes(w)))).slice(0,60);
  box.innerHTML = list.length ? list.map(t=>mini(t, `data-k="${t.k}"${upSpinning?' disabled':''}`, upTarget===t)).join("")
    : `<p class="empty-note">Ничего не нашлось</p>`;
  // шанс на каждой цели, чтобы сразу было видно, на что есть смысл идти
  if(st) box.querySelectorAll("[data-k]").forEach(b=>{ const t = CATALOG[+b.dataset.k], ch = chanceFor(st, t.price);
    const e = document.createElement("span"); e.className = "m-ch" + (ch>=0.3?" hi":ch>=0.1?" mid":""); e.textContent = pct(ch); b.appendChild(e); });
  box.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{
    if(upSpinning) return;
    const t = CATALOG[+b.dataset.k];
    upTarget = upTarget===t ? null : t;
    drawUpTargets(); drawUpMid();
  }));
}

       <div class="goal" style="--rc:${RAR[gsk.rar].color}">${art(gsk)}<small>${esc(title(gsk))}</small><b>${esc(gsk.name)}</b></div>`
    : `${GHOST}<div class="slot-empty"><b>Выберите скин</b><span>справа внизу или множителем</span></div>`;

        <radialGradient id="coreg"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#181818"/></radialGradient></defs>

      <g id="needle" transform="rotate(${(upAngle%360).toFixed(2)} 150 150)">
